# Native CI — path-scoped quality gates for the Gradle monorepo + the two Vite frontends.
#
# Efficiency model (GitHub free tier):
#   - The `changes` job (dorny/paths-filter) scopes the Gradle build to the service
#     modules that actually changed; libs/build-logic/config/workflow changes escalate
#     to a full `./gradlew build`.
#   - The Gradle cache is written ONLY on master (`cache-read-only` elsewhere) so PR
#     churn never evicts the shared cache (10 GB per-repo Actions cache limit).
#   - PRs never build container images — images.yml handles that on master pushes only.
#   - Branch protection should require exactly ONE status check: `gate`. It always
#     runs and fails if any upstream job failed; path-skipped jobs count as success.
#
# Testcontainers spins up real Postgres / Kafka / Redis / Keycloak containers; the
# GitHub-hosted `ubuntu-latest` runner ships a working Docker daemon.
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full build regardless of changed paths"
        type: boolean
        default: false
  schedule:
    # Weekly full build (Mon 03:00 WIB): keeps the cache warm end-to-end, catches drift.
    - cron: "0 20 * * 0"

# Cancel superseded runs on the same ref — but never on master, where cancelling would
# also abort the cache write that later runs depend on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  # Decide what actually needs to run. Filter names that match a Gradle service module
  # feed the scoped target list; `full-backend` (build-logic/libs/config/...) escalates
  # to a full build. Keep the service list in sync with settings.gradle.kts — both the
  # filters below and the ALL array in the jq step (mirrored in images.yml).
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend_run: ${{ steps.plan.outputs.backend_run }}
      backend_targets: ${{ steps.plan.outputs.backend_targets }}
      console: ${{ steps.filter.outputs.console }}
      self_order: ${{ steps.filter.outputs['self-order'] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          # Needed on push events (diff against the pre-push commit); ignored on PRs.
          base: ${{ github.ref_name }}
          filters: |
            gradle-core: &gradle-core
              - 'build-logic/**'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'settings.gradle.kts'
              - 'build.gradle.kts'
              - 'gradle.properties'
              - 'config/**'
              - '.github/workflows/**'
            libs: &libs
              - 'libs/**'
              - 'service-template/**'
            full-backend:
              - *gradle-core
              - *libs
            docs-verify:
              - 'docs/generated/**'
              - 'docs/EVENT-CATALOG.md'
            gateway: ['services/gateway/**']
            org-service: ['services/org-service/**']
            restaurant-service: ['services/restaurant-service/**']
            carwash-service: ['services/carwash-service/**']
            barbershop-service: ['services/barbershop-service/**']
            loyalty-service: ['services/loyalty-service/**']
            finance-service: ['services/finance-service/**']
            entitlement-service: ['services/entitlement-service/**']
            employee-service: ['services/employee-service/**']
            notification-service: ['services/notification-service/**']
            console: ['frontend/console/**']
            self-order: ['frontend/self-order/**']

      - name: Compute Gradle targets
        id: plan
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
          FORCE_FULL: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) }}
        run: |
          ALL='["gateway","org-service","restaurant-service","carwash-service","barbershop-service","loyalty-service","finance-service","entitlement-service","employee-service","notification-service"]'
          if [ "$FORCE_FULL" = "true" ] || echo "$CHANGED" | jq -e 'any(. == "full-backend")' > /dev/null; then
            echo "backend_run=true" >> "$GITHUB_OUTPUT"
            echo "backend_targets=build" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SVCS=$(echo "$CHANGED" | jq -c --argjson all "$ALL" 'map(select(. as $x | $all | index($x) != null))')
          TARGETS=$(echo "$SVCS" | jq -r 'map(":services:" + . + ":build") | join(" ")')
          if [ "$SVCS" != "[]" ] || echo "$CHANGED" | jq -e 'any(. == "docs-verify")' > /dev/null; then
            echo "backend_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend_run=false" >> "$GITHUB_OUTPUT"
          fi
          # verifyProjectDocs is wired into the ROOT project's check only
          # (build.gradle.kts:148) — a scoped :services:X:build silently skips it, so
          # always append it (costs seconds).
          echo "backend_targets=$TARGETS verifyProjectDocs" >> "$GITHUB_OUTPUT"

  # Full quality gate for the changed scope: compile, unit + integration
  # (Testcontainers) tests, ArchUnit, spotless, checkstyle, jacoco ratchet — all wired
  # into `build`/`check` by build-logic.
  backend:
    name: build + test
    needs: changes
    if: needs.changes.outputs.backend_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle (cache written on master only)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Build
        run: ./gradlew ${{ needs.changes.outputs.backend_targets }} --no-daemon --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/checkstyle/
          if-no-files-found: ignore
          retention-days: 5

  console:
    name: console lint + test + build
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/console
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/console/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  self_order:
    name: self-order build
    needs: changes
    if: needs.changes.outputs.self_order == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/self-order
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/self-order/package-lock.json

      - run: npm ci
      # No lint script and no test files yet (vitest fails on an empty suite) — the
      # build (`tsc -b && vite build`) is the gate. Add `npm test` when tests land.
      - run: npm run build

  # The ONLY check branch protection should require. Skipped upstream jobs (path
  # filtering) count as success; any failure or cancellation turns the gate red.
  gate:
    name: gate
    needs: [changes, backend, console, self_order]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any upstream job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "upstream results: changes=${{ needs.changes.result }} backend=${{ needs.backend.result }} console=${{ needs.console.result }} self_order=${{ needs.self_order.result }}"
          exit 1
      - name: All required jobs passed
        run: echo "gate green"
