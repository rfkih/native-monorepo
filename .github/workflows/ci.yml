# Native CI — path-scoped quality gates for the Gradle monorepo + the two Vite frontends.
#
# Efficiency model (GitHub free tier):
#   - The `changes` job (dorny/paths-filter) scopes the Gradle build to the service
#     modules that actually changed; libs/build-logic/config changes escalate
#     to a full `./gradlew build`.
#   - The Gradle cache is written ONLY on master (`cache-read-only` elsewhere) so PR
#     churn never evicts the shared cache (10 GB per-repo Actions cache limit).
#   - PRs never build container images — images.yml handles that on master pushes only.
#   - Branch protection should require exactly TWO status checks: `gate` (this file) and
#     `ai-gate` (ai-gates.yml — the Claude review/QA/security gates, ADR 0057 §4). Each
#     always runs and fails if any upstream job failed; path-skipped jobs count as success.
#   - Release tags (`v*`) also trigger a full run here (no path scoping — `base` is a
#     branch concept and doesn't exist for a tag; reuses the same FORCE_FULL escalation
#     as workflow_dispatch(full)/schedule). This is the gate deploy-prod.yml's `verify-ci`
#     job polls for before the production approval prompt fires — a prod tag can no longer
#     deploy without a green build for that exact commit. A tag run is cheap (a few/week).
#
# Testcontainers spins up real Postgres / Kafka / Redis / Keycloak containers; the
# GitHub-hosted `ubuntu-latest` runner ships a working Docker daemon.
name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full build regardless of changed paths"
        type: boolean
        default: false
  schedule:
    # Weekly full build (Mon 03:00 WIB): keeps the cache warm end-to-end, catches drift.
    - cron: "0 20 * * 0"

# Cancel superseded runs on the same ref — but never on master or a release tag, where
# cancelling would abort the cache write (master) or the deploy-prod.yml gate's wait for
# a concluded run (tag).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # Decide what actually needs to run. Filter names that match a Gradle service module
  # feed the scoped target list; `full-backend` (build-logic/libs/config/...) escalates
  # to a full build. Keep the service list in sync with settings.gradle.kts — both the
  # filters below and the ALL array in the jq step (mirrored in images.yml).
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend_run: ${{ steps.plan.outputs.backend_run }}
      backend_targets: ${{ steps.plan.outputs.backend_targets }}
      # A release tag has no branch to diff against (see the skipped filter step below) and
      # gets the full build unconditionally — mirrors images.yml's FORCE_ALL for the same event.
      console: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || steps.filter.outputs.console }}
      employee: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || steps.filter.outputs.employee }}
      self_order: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || steps.filter.outputs['self-order'] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Filter changed paths
        # Skipped on tag pushes: `base` is a branch concept, and a tag forces the full
        # build below anyway (mirrors images.yml, which skips this same step on tags).
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: dorny/paths-filter@v3
        id: filter
        with:
          # Needed on push events (diff against the pre-push commit); ignored on PRs.
          base: ${{ github.ref_name }}
          filters: |
            gradle-core: &gradle-core
              - 'build-logic/**'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'settings.gradle.kts'
              - 'build.gradle.kts'
              - 'gradle.properties'
              - 'config/**'
              # NOTE: '.github/workflows/**' is deliberately NOT here — a workflow-file edit must
              # not escalate to a full backend build. A pull_request runs the BASE branch's
              # workflow, so building proves nothing about the changed file anyway; force a full
              # run on demand via workflow_dispatch (input: full) if ever needed.
            libs: &libs
              - 'libs/**'
              - 'service-template/**'
            full-backend:
              - *gradle-core
              - *libs
            docs-verify:
              - 'docs/generated/**'
              - 'docs/EVENT-CATALOG.md'
            gateway: ['services/gateway/**']
            org-service: ['services/org-service/**']
            restaurant-service: ['services/restaurant-service/**']
            carwash-service: ['services/carwash-service/**']
            barbershop-service: ['services/barbershop-service/**']
            loyalty-service: ['services/loyalty-service/**']
            finance-service: ['services/finance-service/**']
            entitlement-service: ['services/entitlement-service/**']
            employee-service: ['services/employee-service/**']
            notification-service: ['services/notification-service/**']
            payment-service: ['services/payment-service/**']
            console: ['frontend/console/**']
            # The employee SPA shares source with the console (`@` -> ../console/src), so a
            # console/src change must re-run its gate too (see frontend/employee/Dockerfile).
            employee: ['frontend/employee/**', 'frontend/console/**']
            self-order: ['frontend/self-order/**']

      - name: Compute Gradle targets
        id: plan
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
          FORCE_FULL: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) || startsWith(github.ref, 'refs/tags/') }}
        run: |
          ALL='["gateway","org-service","restaurant-service","carwash-service","barbershop-service","loyalty-service","finance-service","entitlement-service","employee-service","notification-service","payment-service"]'
          if [ "$FORCE_FULL" = "true" ] || echo "$CHANGED" | jq -e 'any(. == "full-backend")' > /dev/null; then
            echo "backend_run=true" >> "$GITHUB_OUTPUT"
            echo "backend_targets=build" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SVCS=$(echo "$CHANGED" | jq -c --argjson all "$ALL" 'map(select(. as $x | $all | index($x) != null))')
          TARGETS=$(echo "$SVCS" | jq -r 'map(":services:" + . + ":build") | join(" ")')
          if [ "$SVCS" != "[]" ] || echo "$CHANGED" | jq -e 'any(. == "docs-verify")' > /dev/null; then
            echo "backend_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend_run=false" >> "$GITHUB_OUTPUT"
          fi
          # verifyProjectDocs is wired into the ROOT project's check only
          # (build.gradle.kts:148) — a scoped :services:X:build silently skips it, so
          # always append it (costs seconds).
          echo "backend_targets=$TARGETS verifyProjectDocs" >> "$GITHUB_OUTPUT"

  # Full quality gate for the changed scope: compile, unit + integration
  # (Testcontainers) tests, ArchUnit, spotless, checkstyle, jacoco ratchet — all wired
  # into `build`/`check` by build-logic.
  backend:
    name: build + test
    needs: changes
    if: needs.changes.outputs.backend_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle (cache written on master only)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Build
        run: ./gradlew ${{ needs.changes.outputs.backend_targets }} --no-daemon --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/checkstyle/
          if-no-files-found: ignore
          retention-days: 5

  console:
    name: console lint + test + build
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/console
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/console/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  employee:
    name: employee lint + test + build
    needs: changes
    if: needs.changes.outputs.employee == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/employee
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/employee/package-lock.json

      - run: npm ci
      # The build's `tsc -b` also type-checks the shared ../console/src, whose react/react-dom are
      # DELIBERATELY unmapped in tsconfig.app.json (so TS uses its @types/react fallback) — meaning
      # they resolve from console's OWN node_modules, which the employee install does not provide.
      # Install console's deps too so CI matches a local build (where ../console/node_modules exists);
      # without this the employee build fails with "Cannot find module 'react'" on the shared source.
      - name: Install console deps for the shared-source type-check
        working-directory: frontend/console
        run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  self_order:
    name: self-order build
    needs: changes
    if: needs.changes.outputs.self_order == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/self-order
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/self-order/package-lock.json

      - run: npm ci
      # No lint script and no test files yet (vitest fails on an empty suite) — the
      # build (`tsc -b && vite build`) is the gate. Add `npm test` when tests land.
      - run: npm run build

  # Fast, always-on: the agent-orientation docs must track the code (event catalog ↔
  # Avro schemas, PROJECT-MAP ↔ service modules). Costs seconds, no toolchain.
  doc_drift:
    name: doc drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check docs against code
        run: bash scripts/check-doc-drift.sh

  # Fast, always-on: no production query may `SELECT *` (CLAUDE.md "Never" — projections only).
  # Catches @Query AND raw JdbcTemplate SQL, which the ArchUnit @Query rule cannot. Costs seconds.
  no_select_star:
    name: no select star
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Forbid SELECT * in production queries
        run: bash scripts/check-no-select-star.sh

  # Fast, always-on: every NEW Flyway migration must be expand/contract (backward-compatible) and
  # applied migrations are immutable — the release invariant that keeps prod's app-tier rollback
  # safe (ADR 0057 §3: an image rollback never triggers a DB rollback). Scans only the diff vs the
  # PR base (or the previous commit on push), so history is never rescanned.
  migration_safety:
    name: migration safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history for the base diff)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Enforce forward-only + expand/contract migrations
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
        run: bash scripts/check-migration-safety.sh

  # The ONLY check branch protection should require. Skipped upstream jobs (path
  # filtering) count as success; any failure or cancellation turns the gate red.
  gate:
    name: gate
    needs: [changes, backend, console, employee, self_order, doc_drift, no_select_star, migration_safety]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any upstream job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "upstream results: changes=${{ needs.changes.result }} backend=${{ needs.backend.result }} console=${{ needs.console.result }} employee=${{ needs.employee.result }} self_order=${{ needs.self_order.result }} doc_drift=${{ needs.doc_drift.result }} no_select_star=${{ needs.no_select_star.result }} migration_safety=${{ needs.migration_safety.result }}"
          exit 1
      - name: All required jobs passed
        run: echo "gate green"
