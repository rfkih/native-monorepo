# Native CI — build, test (unit + Testcontainers integration), ArchUnit, spotless,
# checkstyle, jacoco. One Gradle invocation (`./gradlew build`) runs every gate.
#
# Testcontainers spins up real Postgres / Kafka / Redis containers; the GitHub-hosted
# `ubuntu-latest` runner ships a working Docker daemon, so integration tests run as-is.
#
# AUTHORED BUT UNVERIFIED: this workflow has NOT been executed on a real Actions runner
# (no actionlint available locally). It is YAML-validated only. See deploy/README.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v4

      # Full quality gate: compile, unit + integration (Testcontainers) tests, ArchUnit,
      # spotless, checkstyle, jacoco. A red gate fails the job and blocks the merge.
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/jacoco/
          if-no-files-found: ignore
          retention-days: 7

  # Build (do NOT push) each service container image so the Dockerfiles stay buildable
  # in CI. There is no registry wired yet, so this is build-only; the push step is
  # authored below but guarded behind a registry secret and disabled by default.
  #
  # AUTHORED BUT UNVERIFIED: never run on a real runner; no registry configured.
  images:
    name: build images
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - org-service
          - restaurant-service
          - carwash-service
          - finance-service
          - employee-service
          - notification-service
          - entitlement-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Optional registry login — only runs if the repo sets a REGISTRY variable.
      # Without it the image is built but never pushed (no credentials leave CI).
      - name: Log in to registry
        if: ${{ vars.REGISTRY != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build image (push only when a registry is configured)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: ${{ vars.REGISTRY != '' }}
          tags: ${{ vars.REGISTRY != '' && format('{0}/native/{1}:{2}', vars.REGISTRY, matrix.service, github.sha) || format('native/{0}:{1}', matrix.service, github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The console SPA image (separate build context from the Gradle services: frontend/console).
  # Build-only by default; pushes only when a registry is configured, like the services above.
  #
  # AUTHORED BUT UNVERIFIED: never run on a real runner; no registry configured.
  console-image:
    name: build console image
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: ${{ vars.REGISTRY != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build console-web image (push only when a registry is configured)
        uses: docker/build-push-action@v6
        with:
          context: frontend/console
          file: frontend/console/Dockerfile
          push: ${{ vars.REGISTRY != '' }}
          tags: ${{ vars.REGISTRY != '' && format('{0}/native/console-web:{1}', vars.REGISTRY, github.sha) || format('native/console-web:{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
