# Native — PRODUCTION deploy (ADR 0057 §3). An annotated tag `vX.Y.Z` is the ONLY thing that
# deploys prod (ADR 0053 §3); pushing the tag fires two workflows on the same commit:
#   images.yml    — force-builds the COMPLETE 13-image set at this SHA (its tag trigger)
#   this workflow — verify-ci gates on a green ci.yml run for this SHA (see below), THEN waits
#                   for the images by resolving their digests (retry loop), pins them into a
#                   release manifest, and runs the health-gated deploy on the VPS.
#
# CI gate (closes the "prod releases are CI-ungated" gap): ci.yml now also runs on every `v*`
# tag push (a full build — no path scoping on a tag). The `verify-ci` job below polls the GitHub
# Actions API for a workflow run of ci.yml at this exact commit SHA and fails/blocks the deploy
# job (and therefore the production approval prompt) until one is found with conclusion=success.
# It accepts EITHER the tag-triggered ci run OR an earlier branch/PR run that happened to land on
# this same SHA (head_sha match is all that's checked) — belt and braces, no double build forced.
# A re-tag of an already-green commit therefore passes immediately; a genuinely new commit waits
# for its own ci run. This job has no `environment:`, so it runs (and can fail fast) BEFORE the
# reviewer is asked to approve — nobody approves a deploy whose CI hasn't even started.
#
# The deploy itself is scripts/prod-deploy.sh ON the VPS: flock → DB snapshot (disaster net) →
# pull → rolling up → health gate → smoke → LAST_GOOD | AUTO-ROLLBACK. Exit codes: 0 deployed,
# 1 rolled back to LAST_GOOD (this job fails, prod is healthy), 2 needs manual intervention.
# One-command manual rollback any time: ssh VPS 'bash native-prod/scripts/prod-rollback.sh'.
#
# Protection: the `production` GitHub Environment — add "Required reviewers: <owner>" in repo
# Settings → Environments → production so every prod deploy pauses for explicit approval
# (ADR 0053 §3; the environment is auto-created on first run, the reviewer rule is manual-once).
#
# Required repo secrets:
#   PROD_SSH_KEY      private key for starsky@202.74.75.3 (dedicated deploy key recommended)
# Optional:
#   GHCR_READ_TOKEN   PAT with read:packages — only needed for out-of-band pulls on the VPS;
#                     the deploy itself falls back to the workflow's GITHUB_TOKEN (packages: read)
name: deploy-prod

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)deploy, e.g. v1.2.0"
        required: true

# Never two prod deploys at once; a superseding tag queues behind the running one.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  actions: read # verify-ci reads ci.yml's workflow-run status via the GitHub API (read-only)

env:
  PROD_HOST: 202.74.75.3
  PROD_USER: starsky
  PROD_DIR: native-prod # under $HOME on the VPS
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  # Gate: refuse to even ASK for prod approval until ci.yml is green for this exact commit.
  # No `environment:` here on purpose — this must be able to fail on its own, before the
  # reviewer is prompted (see header). `deploy` below depends on it via `needs`.
  verify-ci:
    name: verify ci ${{ github.event.inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Resolve release SHA
        id: rel
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "verifying ci.yml for $SHA"

      - name: Wait for a green ci run on this exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.rel.outputs.sha }}
        run: |
          # Poll instead of a fixed sleep: the tag push above also triggers ci.yml (it now
          # listens for `v*` tags too), so normally we're just waiting out its run time. We
          # match on head_sha only (not on trigger/event), so a same-SHA branch/PR ci run
          # that already succeeded counts too — belt and braces, and it means a re-tag of an
          # already-green commit passes on the very first check below.
          for attempt in $(seq 1 30); do
            RUNS=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=20" --jq '.workflow_runs')
            COUNT=$(echo "$RUNS" | jq 'length')
            if [ "$COUNT" -gt 0 ]; then
              if echo "$RUNS" | jq -e 'any(.[]; .status == "completed" and .conclusion == "success")' > /dev/null; then
                echo "ci green for $SHA — proceeding to the deploy approval gate"
                exit 0
              fi
              if echo "$RUNS" | jq -e '(all(.[]; .status == "completed")) and (any(.[]; .conclusion != "success"))' > /dev/null; then
                echo "::error::every known ci run for $SHA completed without success — refusing to deploy"
                echo "$RUNS" | jq -r '.[] | "  run \(.id): status=\(.status) conclusion=\(.conclusion) \(.html_url)"'
                exit 1
              fi
              echo "attempt $attempt/30 — ci run(s) found for $SHA still in progress, waiting 60s"
            else
              echo "attempt $attempt/30 — no ci run found yet for $SHA, waiting 60s"
            fi
            sleep 60
          done
          echo "::error::timed out after 30 minutes waiting for a green ci run on $SHA — refusing to deploy"
          exit 1

  deploy:
    name: deploy ${{ github.event.inputs.tag || github.ref_name }}
    needs: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Resolve release identity
        id: rel
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          SHA="$(git rev-parse HEAD)"
          echo "tag=$TAG"  >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"  >> "$GITHUB_OUTPUT"
          echo "release $TAG @ $SHA"

      - name: Log in to GHCR (digest resolution)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin the complete image set to digests (waits for images.yml)
        env:
          SHA: ${{ steps.rel.outputs.sha }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          # Compose-service -> GHCR repo (keep in sync with compose.prod.yml + images.yml +
          # scripts/release-manifest.ps1). The retry loop doubles as the wait-for-build barrier:
          # images.yml force-builds all 13 on the same tag push; until every image:SHA exists,
          # resolution keeps retrying (45 x 60s covers the full cold build).
          declare -A MAP=(
            [gateway]=gateway [org-service]=org-service [restaurant-service]=restaurant-service
            [carwash-service]=carwash-service [barbershop-service]=barbershop-service
            [loyalty-service]=loyalty-service [finance-service]=finance-service
            [entitlement-service]=entitlement-service [employee-service]=employee-service
            [notification-service]=notification-service [payment-service]=payment-service
            [console]=console-web [employee]=employee-web
          )
          MANIFEST="compose.prod.images.yml"
          for attempt in $(seq 1 45); do
            {
              echo "# GENERATED by deploy-prod.yml — release $TAG @ $SHA"
              echo "name: native-prod"
              echo "services:"
            } > "$MANIFEST"
            missing=""
            for svc in "${!MAP[@]}"; do
              repo="${MAP[$svc]}"
              digest=$(docker buildx imagetools inspect "$IMAGE_BASE/$repo:$SHA" \
                         --format '{{.Manifest.Digest}}' 2>/dev/null) || digest=""
              if [ -z "$digest" ]; then missing="$missing $repo"; continue; fi
              printf '  %s:\n    image: %s/%s@%s\n' "$svc" "$IMAGE_BASE" "$repo" "$digest" >> "$MANIFEST"
            done
            if [ -z "$missing" ]; then
              echo "all 13 images resolved on attempt $attempt"; cat "$MANIFEST"; exit 0
            fi
            echo "attempt $attempt/45 — waiting for:$missing"; sleep 60
          done
          echo "::error::incomplete image set for $SHA — images.yml tag build failed or never ran"
          exit 1

      - name: Prepare SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          test -n "$PROD_SSH_KEY" || { echo "::error::PROD_SSH_KEY secret not set"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/prod_key && chmod 600 ~/.ssh/prod_key
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync deploy payload to the VPS
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          SSH="ssh -i ~/.ssh/prod_key -o IdentitiesOnly=yes"
          $SSH "$PROD_USER@$PROD_HOST" "mkdir -p ~/$PROD_DIR/releases ~/$PROD_DIR/scripts ~/$PROD_DIR/backups"
          # Stack definition + configs (prod.env is NEVER synced — it lives only on the VPS).
          rsync -az -e "$SSH" \
            docker/compose.prod.yml docker/prod docker/postgres docker/keycloak docker/minio docker/debezium \
            "$PROD_USER@$PROD_HOST:~/$PROD_DIR/"
          rsync -az -e "$SSH" \
            scripts/prod-deploy.sh scripts/prod-rollback.sh \
            "$PROD_USER@$PROD_HOST:~/$PROD_DIR/scripts/"
          rsync -az -e "$SSH" compose.prod.images.yml \
            "$PROD_USER@$PROD_HOST:~/$PROD_DIR/releases/$TAG.images.yml"

      - name: Deploy (health-gated, auto-rollback)
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          # The workflow token can pull this repo's packages; a PAT secret overrides if set.
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          test -n "$GHCR_READ_TOKEN" || { echo "::error::no GHCR credential available"; exit 1; }
          SSH="ssh -i ~/.ssh/prod_key -o IdentitiesOnly=yes"
          # Login only for the pull window; logout in the always-step below.
          printf '%s' "$GHCR_READ_TOKEN" | $SSH "$PROD_USER@$PROD_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          set +e
          $SSH "$PROD_USER@$PROD_HOST" "cd ~/$PROD_DIR && bash scripts/prod-deploy.sh '$TAG'"
          rc=$?
          set -e
          case "$rc" in
            0) echo "## ✅ $TAG deployed and verified" >> "$GITHUB_STEP_SUMMARY" ;;
            1) echo "## ⚠️ $TAG FAILED — auto-rolled back to LAST_GOOD (prod healthy on previous release)" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "## 🔴 $TAG FAILED and rollback did NOT recover — manual intervention required" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          exit "$rc"

      - name: GHCR logout on the VPS
        if: always()
        run: |
          ssh -i ~/.ssh/prod_key -o IdentitiesOnly=yes "$PROD_USER@$PROD_HOST" \
            "docker logout ghcr.io" || true
