# Native images — build + push container images to GHCR, on pushes to master only.
# PRs never build images (see ci.yml).
#
# Efficiency model: one Gradle invocation builds the changed services' boot jars with
# the warm cache, then each jar is packaged into a thin JRE-only runtime image
# (docker/runtime.Dockerfile) — instead of the per-service Dockerfiles, which re-run
# the whole Gradle build inside Docker with zero cache (kept for local builds only).
# The loop (not a job matrix) exists so the Gradle build runs once, not once per image.
#
# Images: ghcr.io/<owner>/<repo>/<service>:{<sha>,latest} + console-web. GHCR packages
# are created PRIVATE on first push even in a public repo — flip visibility once.
#
# Release tags (ADR 0057): pushing a `v*` tag force-builds the COMPLETE image set at that
# commit's SHA — deploy-prod.yml waits for exactly these by resolving their digests. Tag
# builds deliberately do NOT move `:latest` (re-deploying an old tag must never regress it).
name: images

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      all:
        description: "Force-build and push all images"
        type: boolean
        default: false

# Never cancel a half-pushed tag set; superseded runs just queue.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Same filter map as ci.yml (keep the two in sync; extract a reusable workflow only
  # if the duplication starts to grind).
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.plan.outputs.services }}
      console: ${{ steps.plan.outputs.console }}
      employee: ${{ steps.plan.outputs.employee }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Filter changed paths
        # Skipped on tag pushes: `base` is a branch concept, and tags force-build ALL anyway.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.ref_name }}
          filters: |
            gradle-core: &gradle-core
              - 'build-logic/**'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'settings.gradle.kts'
              - 'build.gradle.kts'
              - 'gradle.properties'
              - 'config/**'
              # NOTE: '.github/workflows/**' is deliberately NOT here — a workflow-file edit must
              # not force-rebuild the whole image set. Release tags still FORCE_ALL, and a real
              # build-logic/libs/config change still escalates; a lone workflow edit does not.
            libs: &libs
              - 'libs/**'
              - 'service-template/**'
            full-backend:
              - *gradle-core
              - *libs
            gateway: ['services/gateway/**']
            org-service: ['services/org-service/**']
            restaurant-service: ['services/restaurant-service/**']
            carwash-service: ['services/carwash-service/**']
            barbershop-service: ['services/barbershop-service/**']
            loyalty-service: ['services/loyalty-service/**']
            finance-service: ['services/finance-service/**']
            entitlement-service: ['services/entitlement-service/**']
            employee-service: ['services/employee-service/**']
            notification-service: ['services/notification-service/**']
            payment-service: ['services/payment-service/**']
            console: ['frontend/console/**']
            # The employee SPA shares source with the console (`@` -> ../console/src), so a
            # console/src change must rebuild it too (see frontend/employee/Dockerfile).
            employee: ['frontend/employee/**', 'frontend/console/**']

      - name: Compute image list
        id: plan
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
          CONSOLE: ${{ steps.filter.outputs.console }}
          EMPLOYEE: ${{ steps.filter.outputs.employee }}
          # Force the complete set on manual request AND on every release tag (deploy needs all 13).
          FORCE_ALL: ${{ (github.event_name == 'workflow_dispatch' && inputs.all) || startsWith(github.ref, 'refs/tags/') }}
        run: |
          ALL='["gateway","org-service","restaurant-service","carwash-service","barbershop-service","loyalty-service","finance-service","entitlement-service","employee-service","notification-service","payment-service"]'
          if [ "$FORCE_ALL" = "true" ] || echo "$CHANGED" | jq -e 'any(. == "full-backend")' > /dev/null; then
            echo "services=$ALL" >> "$GITHUB_OUTPUT"
            echo "console=true" >> "$GITHUB_OUTPUT"
            echo "employee=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "services=$(echo "$CHANGED" | jq -c --argjson all "$ALL" 'map(select(. as $x | $all | index($x) != null))')" >> "$GITHUB_OUTPUT"
          echo "console=$CONSOLE" >> "$GITHUB_OUTPUT"
          echo "employee=$EMPLOYEE" >> "$GITHUB_OUTPUT"

  service-images:
    name: service images
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle (read-only cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          # ci.yml on this same master push owns the cache write; this job only reads.
          cache-read-only: true

      - name: Build boot jars (one Gradle invocation)
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
        run: ./gradlew $(echo "$SERVICES" | jq -r 'map(":services:" + . + ":bootJar") | join(" ")') --no-daemon --stacktrace

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push runtime images
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
          IMAGE_BASE: ghcr.io/${{ github.repository }}
        run: |
          # Build context = the jar's own directory: tiny, and unaffected by the root
          # .dockerignore (which excludes **/build/ for the local from-source builds).
          # No buildx cache: the only layer beyond the JRE base is the jar COPY, which
          # changes every build — caching it would only churn the 10 GB cache limit.
          # Tag builds skip :latest (see header).
          for svc in $(echo "$SERVICES" | jq -r '.[]'); do
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              docker buildx build --push \
                -f docker/runtime.Dockerfile \
                -t "$IMAGE_BASE/$svc:${{ github.sha }}" \
                "services/$svc/build/libs"
            else
              docker buildx build --push \
                -f docker/runtime.Dockerfile \
                -t "$IMAGE_BASE/$svc:${{ github.sha }}" \
                -t "$IMAGE_BASE/$svc:latest" \
                "services/$svc/build/libs"
            fi
          done

  console-image:
    name: console image
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push console-web image
        uses: docker/build-push-action@v6
        with:
          context: frontend/console
          file: frontend/console/Dockerfile
          push: true
          # Tag builds skip :latest (see header) — the empty line the expression leaves is ignored.
          tags: |
            ghcr.io/${{ github.repository }}/console-web:${{ github.sha }}
            ${{ !startsWith(github.ref, 'refs/tags/') && format('ghcr.io/{0}/console-web:latest', github.repository) || '' }}
          # mode=min (final-stage layers only): the sole buildx cache in the repo, so
          # the Gradle cache never gets evicted by image-layer churn.
          cache-from: type=gha,scope=console
          cache-to: type=gha,mode=min,scope=console

  employee-image:
    name: employee image
    needs: changes
    if: needs.changes.outputs.employee == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push employee-web image
        uses: docker/build-push-action@v6
        with:
          # PARENT context: the employee SPA shares source with the console via the `@`
          # alias -> ../console/src, so both frontend/employee and frontend/console must be
          # present at build time (see frontend/employee/Dockerfile).
          context: frontend
          file: frontend/employee/Dockerfile
          push: true
          # Tag builds skip :latest (see header) — the empty line the expression leaves is ignored.
          tags: |
            ghcr.io/${{ github.repository }}/employee-web:${{ github.sha }}
            ${{ !startsWith(github.ref, 'refs/tags/') && format('ghcr.io/{0}/employee-web:latest', github.repository) || '' }}
          cache-from: type=gha,scope=employee
          cache-to: type=gha,mode=min,scope=employee
