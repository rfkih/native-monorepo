# Gradle version catalog — the single source of truth for dependency versions.
# Modules reference these as libs.* ; the build-logic composite pins its own
# plugin versions separately (it is a standalone build and cannot see this catalog).
[versions]
springBoot = "4.1.0"
junit = "5.11.4"
testcontainers = "2.0.5"
avro = "1.12.1"
postgresql = "42.7.4"
h2 = "2.3.232"
archunit = "1.4.1"  # 1.4.1+ bundles ASM 9.8 (understands Java 25 bytecode); 1.3.0 cannot
springdoc = "3.0.3" # OpenAPI docs; the 3.0.x line targets Spring Boot 4 / Framework 7 (2.8.x is Boot 3) — ADR 0004
# Build tooling (also pinned literally in build-logic where the catalog isn't visible)
spotless = "7.0.2"
googleJavaFormat = "1.25.2"
checkstyle = "10.21.1"
jacoco = "0.8.15"
foojay = "1.0.0"
awssdk = "2.46.7" # AWS SDK v2 — generic S3 client for the MinIO object store (ADR 0048); vendor-neutral exit
bouncycastle = "1.85.2" # bcprov-jdk18on — Argon2PasswordEncoder's JCE provider (ADR 0049 P1 operator PIN hashing)

[libraries]
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
avro = { module = "org.apache.avro:avro", version.ref = "avro" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
springdoc-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
awssdk-s3 = { module = "software.amazon.awssdk:s3", version.ref = "awssdk" }
awssdk-apache5-client = { module = "software.amazon.awssdk:apache5-client", version.ref = "awssdk" }
bouncycastle-provider = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
