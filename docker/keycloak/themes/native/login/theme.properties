# Native login theme — extends Keycloak's stock keycloak.v2 (PatternFly v5) login and layers a
# brand stylesheet on top, so the hosted login page matches the console's neutral-ink design system
# (ADR 0077; split canvas: a photo brand rail beside the form on wide screens; a centred card on mobile).
# Keeping keycloak.v2 as the parent means all functional templates, i18n, error handling and
# social-provider markup are inherited untouched; native.css only re-skins colours/fonts/shape.
parent=keycloak.v2
import=common/keycloak
# The stylesheet's FILE NAME is the cache-buster: Keycloak serves theme resources under
# /auth/resources/<kc-version>/... with Cache-Control max-age=30d, Cloudflare caches .css at the edge
# AND ignores the query string in its cache key — so `?v=` did nothing, and a restyled native.css was
# served stale for a month (the ink rebrand, 2026-09-12: Keycloak and the edge nginx served the new
# file, Cloudflare a HIT on the old, restart or not). RENAME the file on every restyle.
styles=css/styles.css css/native-ink.css
# The product ships English + Bahasa Indonesia (mirrors the console's locales).
locales=en,id
