# Native PROD — single-origin edge proxy (see docker/compose.prod.yml). Adapted from
# docker/uat/edge.conf. Android installers are served from the ./prod/downloads host mount on the
# business origin (ADR 0058) — the prod app is a SEPARATE app from UAT (applicationId
# id.co.nativeapp.till, name "Native"). Drop a build only once a STABLE prod origin is baked into it
# (a named tunnel / domain), never an ephemeral quick-tunnel URL — see docker/prod/downloads/README.md.
#
# A Cloudflare tunnel terminates TLS at Cloudflare and forwards plain HTTP here. Two origins:
#   :8080  business  — / -> console SPA · /auth/ -> Keycloak · /api/ -> gateway
#   :8081  employee  — / -> employee SPA · /api/ -> gateway (same-origin, so no API CORS)
# Blocked from the internet: Keycloak admin console + master realm + welcome page.
# NO /actuator route — gateway health/prometheus stay private.
#
# X-Forwarded-For is OVERWRITTEN with cloudflared's CF-Connecting-IP, never appended: the
# gateway's anonymous rate limiter keys on the LAST XFF entry, and an appended chain would
# end in cloudflared's container IP — one shared bucket for the whole internet.

# --- Business origin -------------------------------------------------------------------
server {
    listen 8080;
    server_name _;

    # Resolve upstreams per-request via Docker DNS (edge may start before the app containers).
    resolver 127.0.0.11 valid=10s ipv6=off;
    absolute_redirect off;
    client_max_body_size 20m;

    set $client_ip $http_cf_connecting_ip;

    # --- SPA OIDC redirect carve-outs (exact match wins over the /auth/ prefix) ---
    location = /auth/callback {
        set $console http://console:8080;
        proxy_pass $console;
        proxy_set_header Host $host;
    }
    # ADR 0049 P3b: owner/manager elevation callback (second OIDC round-trip on a device terminal).
    location = /auth/elevate-callback {
        set $console_elevate http://console:8080;
        proxy_pass $console_elevate;
        proxy_set_header Host $host;
    }

    # --- Keycloak surfaces that must never be public ---
    location = /auth          { return 404; }
    location = /auth/         { return 404; }
    location /auth/admin/     { return 404; }
    location = /auth/admin    { return 404; }
    location /auth/realms/master/ { return 404; }

    # --- Keycloak (issuer, login pages, JWKS, theme assets) ---
    location /auth/ {
        set $kc http://keycloak:8080;
        proxy_pass $kc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $client_ip;
    }

    # --- API via the gateway ---
    location /api/ {
        set $gw http://gateway:8080;
        proxy_pass $gw;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $client_ip;
    }

    # --- Android app installer (ADR 0058) ---
    # Served from a host bind mount (docker/prod/downloads -> /srv/downloads), NOT from inside the
    # console image (a console recreate would silently drop a docker-cp'd APK, and the SPA fallback
    # below would then answer the .apk URL with index.html). Any top-level *.apk resolves against the
    # mount; a missing file is a REAL 404, never the SPA shell. This MUST stay ABOVE `location /`.
    # New release = drop native-app-prod-v<versionCode>.apk into docker/prod/downloads/ and bump the
    # "latest" alias below (see docker/prod/downloads/README.md). Prod is a SEPARATE app from UAT.
    location ~* ^/[^/]+\.apk$ {
        root /srv/downloads;
        add_header Cache-Control "no-store";
    }
    # Stable "latest" links — 302 to the current versioned prod APKs. Bump ONLY these targets per
    # release. 404 until the first prod build is dropped (no APK is baked against an ephemeral URL).
    location = /native-app-latest.apk          { return 302 /native-app-prod-v9.apk; }
    location = /native-employee-app-latest.apk { return 302 /native-employee-app-prod-v1.apk; }

    # --- OTA web-bundle updates (ADR 0051 P3, Capgo self-hosted) ---
    # Same host mount, under /app/updates/: updates.json + versioned bundle zips. The Capgo client
    # POSTs the update-check; a static file returns 405 for POST, so error_page rewrites it to 200.
    # OFF until a build sets NATIVE_TILL_UPDATE_URL to https://<origin>/app/updates/updates.json.
    location /app/updates/ {
        root /srv/downloads;
        error_page 405 =200 $uri;
        add_header Cache-Control "no-store";
    }

    # --- Console SPA (env.js, assets, history fallback handled downstream) ---
    location / {
        set $console http://console:8080;
        proxy_pass $console;
        proxy_set_header Host $host;
    }
}

# --- Employee origin (ADR 0049 P5) -----------------------------------------------------
# / -> employee SPA, /api -> gateway (same-origin). Keycloak is reached by the browser at
# the BUSINESS origin (${PUBLIC_URL}/auth — the token issuer) directly, so this origin needs
# only /api + the SPA; its /auth/callback lands via the employee nginx history fallback.
server {
    listen 8081;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    absolute_redirect off;
    client_max_body_size 20m;

    set $client_ip $http_cf_connecting_ip;

    location /api/ {
        set $gw http://gateway:8080;
        proxy_pass $gw;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $client_ip;
    }

    location / {
        set $employee http://employee:8080;
        proxy_pass $employee;
        proxy_set_header Host $host;
    }
}
