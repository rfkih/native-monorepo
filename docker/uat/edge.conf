# Native UAT — single-origin edge proxy (see docker/compose.uat.yml).
#
# One cloudflared quick tunnel terminates TLS at Cloudflare and forwards plain HTTP
# here. Everything the internet sees is ONE origin:
#   /              -> console SPA (its own nginx serves assets + history fallback)
#   /auth/callback -> console SPA  (OIDC redirect landing — exact match MUST beat /auth/)
#   /auth/         -> Keycloak     (KC_HTTP_RELATIVE_PATH=/auth, no rewrite)
#   /api/          -> gateway      (full inbound path preserved)
#   /*.apk         -> host mount   (Android installer, docker/uat/downloads)
# Blocked from the internet: Keycloak admin console + master realm + welcome page.
# There is deliberately NO /actuator route — gateway health/prometheus stay private.
#
# X-Forwarded-For is OVERWRITTEN with cloudflared's CF-Connecting-IP, never appended:
# the gateway's anonymous rate limiter keys on the LAST XFF entry
# (AnonymousRateLimitFilter), and an appended chain would end in cloudflared's
# container IP — one shared bucket for the whole internet.

server {
    listen 8080;
    server_name _;

    # Resolve upstreams per-request via Docker DNS: the edge starts BEFORE the app
    # containers exist (the tunnel URL must be known first), and a static proxy_pass
    # host would fail nginx startup. Variables defer resolution to request time.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Locally-generated redirects (the legacy .apk 302 below) must stay RELATIVE:
    # the default absolute form would leak this container's internal http://host:8080,
    # which the funnel's https origin can't reach.
    absolute_redirect off;

    client_max_body_size 20m;

    set $client_ip $http_cf_connecting_ip;

    # --- SPA OIDC redirect carve-out (exact match wins over the /auth/ prefix) ---
    location = /auth/callback {
        set $console http://console:8080;
        proxy_pass $console;
        proxy_set_header Host $host;
    }

    # ADR 0049 P3b: the owner/manager ELEVATION callback (second OIDC round-trip on a device
    # terminal) — same carve-out; without it /auth/elevate-callback falls through to Keycloak → 404.
    location = /auth/elevate-callback {
        set $console_elevate http://console:8080;
        proxy_pass $console_elevate;
        proxy_set_header Host $host;
    }

    # --- Keycloak surfaces that must never be public ---
    location = /auth          { return 404; }
    location = /auth/         { return 404; }
    location /auth/admin/     { return 404; }
    location = /auth/admin    { return 404; }
    location /auth/realms/master/ { return 404; }

    # --- Keycloak (issuer, login pages, JWKS, theme assets) ---
    location /auth/ {
        set $kc http://keycloak:8080;
        proxy_pass $kc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $client_ip;
    }

    # --- Android app installer ---
    # Served from a host bind mount (docker/uat/downloads -> /srv/downloads), NOT from
    # inside the console image: a console recreate silently dropped the docker-cp'd APK
    # twice, and the console's SPA fallback then served index.html for the .apk URL
    # (browser "downloads" the app and lands on the home page). Any top-level *.apk
    # resolves against the mount; a missing file is a REAL 404, never the SPA shell.
    # New release = drop native-app-v<versionCode>.apk into docker/uat/downloads/.
    location ~* ^/[^/]+\.apk$ {
        root /srv/downloads;
        add_header Cache-Control "no-store";
    }

    # Legacy shared links (installer renamed native-till.apk -> native-app-v<versionCode>.apk).
    # Bump the target on each release, or drop the line once old links have rotted.
    location = /native-till.apk { return 302 /native-app-v6.apk; }

    # --- API via the gateway ---
    location /api/ {
        set $gw http://gateway:8080;
        proxy_pass $gw;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $client_ip;
    }

    # --- Console SPA (env.js, assets, history fallback handled downstream) ---
    location / {
        set $console http://console:8080;
        proxy_pass $console;
        proxy_set_header Host $host;
    }
}
