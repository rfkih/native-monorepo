# Native UAT — single-origin edge proxy (see docker/compose.uat.yml).
#
# One cloudflared quick tunnel terminates TLS at Cloudflare and forwards plain HTTP
# here. Everything the internet sees is ONE origin:
#   /              -> console SPA (its own nginx serves assets + history fallback)
#   /auth/callback -> console SPA  (OIDC redirect landing — exact match MUST beat /auth/)
#   /auth/         -> Keycloak     (KC_HTTP_RELATIVE_PATH=/auth, no rewrite)
#   /api/          -> gateway      (full inbound path preserved)
# Blocked from the internet: Keycloak admin console + master realm + welcome page.
# There is deliberately NO /actuator route — gateway health/prometheus stay private.
#
# X-Forwarded-For is OVERWRITTEN with cloudflared's CF-Connecting-IP, never appended:
# the gateway's anonymous rate limiter keys on the LAST XFF entry
# (AnonymousRateLimitFilter), and an appended chain would end in cloudflared's
# container IP — one shared bucket for the whole internet.

server {
    listen 8080;
    server_name _;

    # Resolve upstreams per-request via Docker DNS: the edge starts BEFORE the app
    # containers exist (the tunnel URL must be known first), and a static proxy_pass
    # host would fail nginx startup. Variables defer resolution to request time.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 20m;

    set $client_ip $http_cf_connecting_ip;

    # --- SPA OIDC redirect carve-out (exact match wins over the /auth/ prefix) ---
    location = /auth/callback {
        set $console http://console:8080;
        proxy_pass $console;
        proxy_set_header Host $host;
    }

    # --- Keycloak surfaces that must never be public ---
    location = /auth          { return 404; }
    location = /auth/         { return 404; }
    location /auth/admin/     { return 404; }
    location = /auth/admin    { return 404; }
    location /auth/realms/master/ { return 404; }

    # --- Keycloak (issuer, login pages, JWKS, theme assets) ---
    location /auth/ {
        set $kc http://keycloak:8080;
        proxy_pass $kc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $client_ip;
    }

    # --- API via the gateway ---
    location /api/ {
        set $gw http://gateway:8080;
        proxy_pass $gw;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $client_ip;
    }

    # --- Console SPA (env.js, assets, history fallback handled downstream) ---
    location / {
        set $console http://console:8080;
        proxy_pass $console;
        proxy_set_header Host $host;
    }
}
