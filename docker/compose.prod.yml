# Native — PRODUCTION stack (ADR 0053 + ADR 0057). The full platform (11 services +
# console + employee app) co-located on the owner's VPS `middleware`, which ALSO runs an
# unrelated live workload (Blackheart/vector) — hence the hard resource caps below.
#
# HOW PROD DIFFERS FROM compose.uat.yml (read both together — this file is deliberately
# a close mirror so what UAT exercises is what prod runs):
#   1. Images are PULLED from GHCR by immutable ref (${IMAGE_BASE}/<svc>:${NATIVE_IMAGE_TAG});
#      NOTHING is built here. Prod deploys the exact digest QA'd on UAT (ADR 0053 §1).
#   2. Every container has a CPU cap (`cpus`) AND a memory cap (`mem_limit`) so a Native
#      spike can never starve the co-located trading platform (ADR 0057 co-location guardrail).
#   3. NOTHING is published except three 127.0.0.1 operator ports (KC admin, Connect REST,
#      cloudflared metrics) on PROD-UNIQUE numbers. The public edge is the Cloudflare tunnel,
#      which reaches the edge over the compose network — the edge has NO host port at all.
#   4. Isolated project (`native-prod`), own network, own `native-prod-*` volumes, own
#      `prod.env` (secrets NEVER reused from UAT — ADR 0057).
#   5. Edge = Cloudflare Tunnel (ADR 0057), NOT Tailscale Funnel (exhausted on this box).
#      Interim: two QUICK tunnels (business + employee origins) → ephemeral *.trycloudflare.com.
#      Target: one NAMED tunnel on a real domain (see docker/prod/cloudflared/config.yml.example).
#
# Operate it ONLY via scripts/prod-up.ps1 (Phase 5) — never `docker compose ... up` by hand:
# the deploy is health-gated with automatic rollback (ADR 0057). Interpolation comes from the
# gitignored docker/prod.env (see docker/prod.env.example):
#   docker compose --env-file docker/prod.env -f docker/compose.prod.yml -p native-prod ...

name: native-prod

x-java-env: &java-env
  SPRING_PROFILES_ACTIVE: prod # prod-guards ON: services refuse dev placeholder keys at startup
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  # Both apps share ONE token issuer = the business origin (ADR 0049 P5): the employee app's
  # browser reaches Keycloak at ${PUBLIC_URL}/auth directly, so the `iss` services validate is
  # the same regardless of which origin served the SPA.
  KEYCLOAK_ISSUER_URI: ${PUBLIC_URL}/auth/realms/native
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/native/protocol/openid-connect/certs
  SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "5"
  SPRING_DATASOURCE_HIKARI_MINIMUMIDLE: "1"
  JDK_JAVA_OPTIONS: "-XX:MaxRAMPercentage=55.0 -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError"

# Shared shape for the 11 Java services. `cpus` is the co-location guardrail (a burst
# ceiling, not a reservation — idle services still cost ~0): no single service can grab
# more than one core, so a runaway loop can't drown Blackheart. `mem_limit` + ExitOnOOM +
# restart = fail fast, come back clean.
x-java-service: &java-service
  restart: unless-stopped
  mem_limit: 512m
  cpus: 1.0
  healthcheck:
    # Temurin JRE has bash but no curl; /dev/tcp is a bash builtin.
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
    interval: 10s
    timeout: 5s
    retries: 18
    start_period: 120s

services:
  # ---------------------------------------------------------------------------
  # Infra. Same images/tuning as UAT; no host ports, prod-scoped volumes/network.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: native-prod-postgres
    restart: unless-stopped
    mem_limit: 768m
    cpus: 2.0
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=20
      - -c
      - max_replication_slots=20
      - -c
      - max_connections=150
    environment:
      POSTGRES_USER: postgres
      # TODO(ADR 0057 hardening): superuser + per-service role passwords are still the
      # literals baked into ./postgres/init (matches dev/UAT). Postgres has NO host port
      # (internal compose network only, behind RLS), so this is not remotely reachable —
      # but generate real secrets + parametrize the init scripts before external tenants.
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      # Shared init (per-service DBs, roles, RLS) — same scripts as dev/UAT.
      # TODO(ADR 0057 hardening): the per-service DB passwords are still set by these
      # init scripts (role name == password). Acceptable for now — Postgres has NO host
      # port and is reachable only on the internal compose network behind RLS — but move
      # to generated per-service secrets before onboarding external tenants.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - native-prod-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: native-prod-kafka
    restart: unless-stopped
    mem_limit: 768m
    cpus: 2.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: native-prod-cluster-0001
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx512M"
    volumes:
      - native-prod-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 10

  connect:
    image: debezium/connect:2.7.3.Final
    container_name: native-prod-connect
    restart: unless-stopped
    mem_limit: 896m
    cpus: 1.5
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:19093:8083" # operator-only: connector registration/status (prod-unique)
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: native-prod-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.converters.ByteArrayConverter
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx512M"
      HEAP_OPTS: "-Xms256M -Xmx512M"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: native-prod-keycloak
    restart: unless-stopped
    mem_limit: 1024m
    cpus: 1.5
    # Production mode `start` (NOT start-dev — dev mode disables caching + uses dev hostname
    # defaults, unfit for prod). No --optimized: the stock image isn't pre-built, so KC
    # auto-runs `build` on boot (+~15s) — correct and self-contained. --import-realm fires
    # ONLY into an empty DB (first boot); thereafter users + kcadm patches persist in Postgres.
    command: ["start", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD} # effective only on first (empty-DB) boot
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak # literal from ./postgres/init (see the POSTGRES hardening TODO)
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${PUBLIC_URL}/auth
      KC_HOSTNAME_ADMIN: http://localhost:19090/auth # operator admin via loopback (prod-unique)
      KC_HOSTNAME_STRICT: "false"
      # TLS is terminated at Cloudflare + the edge; KC speaks plain HTTP internally, which
      # production `start` disables unless explicitly enabled. Safe: KC has no host port and
      # is only reached over the compose network (+ the loopback admin port).
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded # trust the edge's X-Forwarded-Proto=https
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:19090:8080" # operator-only: admin console (never routed through the tunnel)
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - ./keycloak/themes/native:/opt/keycloak/themes/native:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: native-prod-redis
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO — object store (ADR 0048). No public port; the only public surface is the
  # gateway's anonymous GET /api/media/restaurant/** proxy. Back up with `mc mirror`
  # (objects do NOT ride along in pg_dump — see the nightly backup job, Phase 6).
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: native-prod-minio
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: native-minio-root
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - native-prod-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: native-prod-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_ROOT_USER: native-minio-root
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MEDIA_RESTAURANT_ACCESS_KEY: restaurant-media
      MEDIA_RESTAURANT_SECRET_KEY: ${MEDIA_RESTAURANT_SECRET_KEY}
      MEDIA_EMPLOYEE_ACCESS_KEY: employee-media
      MEDIA_EMPLOYEE_SECRET_KEY: ${MEDIA_EMPLOYEE_SECRET_KEY}
      MEDIA_PAYMENT_ACCESS_KEY: payment-media
      MEDIA_PAYMENT_SECRET_KEY: ${MEDIA_PAYMENT_SECRET_KEY}
    volumes:
      - ./minio/init.sh:/init.sh:ro

  # ---------------------------------------------------------------------------
  # The 11 Native services — pulled from GHCR by immutable ref. All listen on 8080,
  # nothing published; the gateway reaches them by compose hostname.
  # ---------------------------------------------------------------------------
  gateway:
    <<: *java-service
    image: ${IMAGE_BASE:-ghcr.io/rfkih/native-monorepo}/gateway:${NATIVE_IMAGE_TAG:-latest}
    container_name: native-prod-gateway
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *java-env
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEDIA_URI: http://minio:9000
      # Behind cloudflared the real client IP arrives as CF-Connecting-IP, which the edge
      # writes into a single-entry X-Forwarded-For (see docker/prod/edge.conf).
      SIGNUP_RATE_LIMIT_TRUST_XFF: "true"
      SELF_ORDER_RATE_LIMIT_TRUST_XFF: "true"
      MEDIA_RATE_LIMIT_TRUST_XFF: "true"

  org-service:
    <<: *java-service
    image: ${IMAGE_BASE:-ghcr.io/rfkih/native-monorepo}/org-service:${NATIVE_IMAGE_TAG:-latest}
    container_name: native-prod-org-service
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/org_service
      DB_USERNAME: org_service
      DB_PASSWORD: org_service
      KEYCLOAK_BASE_URL: http://keycloak:8080/auth
      KEYCLOAK_ADMIN_SECRET: ${KEYCLOAK_ADMIN_SECRET}
      ORG_PII_KEY: ${ORG_PII_KEY}

  restaurant-service:
    <<: *java-service
    image: ${IMAGE_BASE:-ghcr.io/rfkih/native-monorepo}/restaurant-service:${NATIVE_IMAGE_TAG:-latest}
    container_name: native-prod-restaurant-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/restaurant_service
      DB_USERNAME: restaurant_service
      DB_PASSWORD: restaurant_service
      NATIVE_GIFTCARD_CODE_KEY: ${NATIVE_GIFTCARD_CODE_KEY}
      MEDIA_ENDPOINT: http://minio:9000
      MEDIA_ACCESS_KEY: restaurant-media
      MEDIA_SECRET_KEY: ${MEDIA_RESTAURANT_SECRET_KEY}
      MEDIA_PUBLIC_BASE_URL: ${PUBLIC_URL}/api/media
      NATIVE_OPERATOR_TOKEN_KEY: ${NATIVE_OPERATOR_TOKEN_KEY}

  carwash-service:
    <<: *java-service
    image: ${IMAGE_BASE:-ghcr.io/rfkih/native-monorepo}/carwash-service:${NATIVE_IMAGE_TAG:-latest}
    container_name: native-prod-carwash-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/carwash_service
      DB_USERNAME: carwash_service
      DB_PASSWORD: carwash_service
      NATIVE_GIFTCARD_CODE_KEY: ${NATIVE_GIFTCARD_CODE_KEY}
      NATIVE_OPERATOR_TOKEN_KEY: ${NATIVE_OPERATOR_TOKEN_KEY}

  barbershop-service:
    <<: *java-service
    image: ${IMAGE_BASE:-ghcr.io/rfkih/native-monorepo}/barbershop-service:${NATIVE_IMAGE_TAG:-latest}
    container_name: native-prod-barbershop-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/barbershop_service
      DB_USERNAME: barbershop_service
      DB_PASSWORD: barbershop_service
      NATIVE_GIFTCARD_CODE_KEY: ${NATIVE_GIFTCARD_CODE_KEY}
      NATIVE_OPERATOR_TOKEN_KEY: ${NATIVE_OPERATOR_TOKEN_KEY}

  loyalty-service:
    <<: *java-service
    image: ${IMAGE_BASE:-ghcr.io/rfkih/native-monorepo}/loyalty-service:${NATIVE_IMAGE_TAG:-latest}
    container_name: native-prod-loyalty-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/loyalty_service
      DB_USERNAME: loyalty_service
      DB_PASSWORD: loyalty_service
      NATIVE_PII_KEY: ${NATIVE_PII_KEY}
      NATIVE_PII_HMAC_KEY: ${NATIVE_PII_HMAC_KEY}
      NATIVE_GIFTCARD_CODE_KEY: ${NATIVE_GIFTCARD_CODE_KEY}

  finance-service:
    <<: *java-service
    image: ${IMAGE_BASE:-ghcr.io/rfkih/native-monorepo}/finance-service:${NATIVE_IMAGE_TAG:-latest}
    container_name: native-prod-finance-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/finance_service
      DB_USERNAME: finance_service
      DB_PASSWORD: finance_service

  entitlement-service:
    <<: *java-service
    image: ${IMAGE_BASE:-ghcr.io/rfkih/native-monorepo}/entitlement-service:${NATIVE_IMAGE_TAG:-latest}
    container_name: native-prod-entitlement-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/entitlement_service
      DB_USERNAME: entitlement_service
      DB_PASSWORD: entitlement_service

  employee-service:
    <<: *java-service
    image: ${IMAGE_BASE:-ghcr.io/rfkih/native-monorepo}/employee-service:${NATIVE_IMAGE_TAG:-latest}
    container_name: native-prod-employee-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/employee_service
      DB_USERNAME: employee_service
      DB_PASSWORD: employee_service
      NATIVE_PII_KEY: ${NATIVE_PII_KEY}
      MEDIA_ENDPOINT: http://minio:9000
      MEDIA_ACCESS_KEY: employee-media
      MEDIA_SECRET_KEY: ${MEDIA_EMPLOYEE_SECRET_KEY}
      NATIVE_OPERATOR_TOKEN_KEY: ${NATIVE_OPERATOR_TOKEN_KEY}

  notification-service:
    <<: *java-service
    image: ${IMAGE_BASE:-ghcr.io/rfkih/native-monorepo}/notification-service:${NATIVE_IMAGE_TAG:-latest}
    container_name: native-prod-notification-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/notification_service
      DB_USERNAME: notification_service
      DB_PASSWORD: notification_service

  # QRIS payment modes + PSP charge lifecycle (ADR 0045). NATIVE_PII_KEY is MANDATORY under
  # the prod profile (it encrypts merchants' own Midtrans server keys).
  # NOTE: this image is NOT yet published by images.yml — Phase 2 adds payment-service (and
  # the employee-web frontend) to the CI image matrix before prod can pull a complete set.
  payment-service:
    <<: *java-service
    image: ${IMAGE_BASE:-ghcr.io/rfkih/native-monorepo}/payment-service:${NATIVE_IMAGE_TAG:-latest}
    container_name: native-prod-payment-service
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/payment_service
      DB_USERNAME: payment_service
      DB_PASSWORD: payment_service
      NATIVE_PII_KEY: ${NATIVE_PII_KEY}
      NATIVE_PAYMENT_WEBHOOK_BASE_URL: ${PUBLIC_URL}
      MEDIA_ENDPOINT: http://minio:9000
      MEDIA_ACCESS_KEY: payment-media
      MEDIA_SECRET_KEY: ${MEDIA_PAYMENT_SECRET_KEY}

  # ---------------------------------------------------------------------------
  # Frontends — one image per URL: entrypoint rewrites env.js from NATIVE_*.
  # ---------------------------------------------------------------------------
  console:
    image: ${IMAGE_BASE:-ghcr.io/rfkih/native-monorepo}/console-web:${NATIVE_IMAGE_TAG:-latest}
    container_name: native-prod-console
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.5
    environment:
      NATIVE_AUTH_MODE: oidc
      NATIVE_API_BASE_URL: "" # same-origin: relative /api through the edge
      NATIVE_KEYCLOAK_URL: ${PUBLIC_URL}/auth
      NATIVE_KEYCLOAK_REALM: native
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/index.html"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Employee app SPA (ADR 0049 P5) — the second public origin (its own quick tunnel).
  # NATIVE_KEYCLOAK_URL stays the business ${PUBLIC_URL} issuer so the token `iss` is unchanged.
  # NOTE: employee-web image is published by Phase 2 (not yet in images.yml).
  employee:
    image: ${IMAGE_BASE:-ghcr.io/rfkih/native-monorepo}/employee-web:${NATIVE_IMAGE_TAG:-latest}
    container_name: native-prod-employee
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.5
    environment:
      NATIVE_AUTH_MODE: oidc
      NATIVE_API_BASE_URL: "" # same-origin: relative /api through the :8081 edge block
      NATIVE_KEYCLOAK_URL: ${PUBLIC_URL}/auth
      NATIVE_KEYCLOAK_REALM: native
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/index.html"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Edge (nginx). Serves TWO single origins: :8080 (business console+auth+api) and
  # :8081 (employee app+api). No host port — the Cloudflare tunnel(s) reach it over
  # the compose network. Config resolves upstreams per-request (Docker DNS).
  # ---------------------------------------------------------------------------
  edge:
    image: nginx:alpine
    container_name: native-prod-edge
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.5
    volumes:
      - ./prod/edge.conf:/etc/nginx/conf.d/default.conf:ro
      # Android installers (ADR 0058): the edge serves any top-level /*.apk + /app/updates/ from this
      # host mount, so an APK survives every container rebuild/recreate. Binaries are gitignored; the
      # dir is kept by docker/prod/downloads/.gitkeep. Empty until a stable-origin prod build is dropped.
      - ./prod/downloads:/srv/downloads:ro

  # ---------------------------------------------------------------------------
  # Cloudflare tunnels. INTERIM: two quick tunnels (profile: quicktunnel) → ephemeral
  # *.trycloudflare.com, one per public origin. restart:"no" ON PURPOSE — an auto-restart
  # mints a NEW URL while Keycloak + services still validate the old issuer; fail loud and
  # let scripts/prod-up.ps1 re-wire. TARGET (once a domain exists): replace both with ONE
  # named tunnel — see docker/prod/cloudflared/config.yml.example — and drop this profile.
  # ---------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: native-prod-cloudflared
    profiles: ["quicktunnel"]
    restart: "no"
    mem_limit: 128m
    cpus: 0.5
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "--url", "http://edge:8080"]
    ports:
      - "127.0.0.1:12001:2000" # GET /quicktunnel -> {"hostname":"xxx.trycloudflare.com"} (business)

  cloudflared-employee:
    image: cloudflare/cloudflared:latest
    container_name: native-prod-cloudflared-employee
    profiles: ["quicktunnel"]
    restart: "no"
    mem_limit: 128m
    cpus: 0.5
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "--url", "http://edge:8081"]
    ports:
      - "127.0.0.1:12002:2000" # GET /quicktunnel -> {"hostname":"...trycloudflare.com"} (employee)

  # NAMED tunnel (profile: namedtunnel) — the DURABLE prod edge, now that native-app.my.id is on
  # Cloudflare. Remotely-managed (dashboard) tunnel: the connector authenticates with a single
  # TUNNEL TOKEN (prod.env CF_TUNNEL_TOKEN) and pulls its ingress from Cloudflare — the public
  # hostnames app.native-app.my.id -> http://edge:8080 (business) and emp.native-app.my.id ->
  # http://edge:8081 (employee) are configured in the Zero Trust dashboard, and Cloudflare
  # auto-creates their DNS. Stable URL, so restart:unless-stopped. Replaces BOTH quick tunnels
  # (drop the quicktunnel profile once this is verified live). Reaches the edge by the compose
  # hostname `edge` over native-prod_default — no host port, no config files, no cert JSON.
  cloudflared-named:
    image: cloudflare/cloudflared:latest
    container_name: native-prod-cloudflared-named
    profiles: ["namedtunnel"]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CF_TUNNEL_TOKEN:-}"]

  # Dedicated Tailscale node for Native prod (profile: tsfunnel) — an INTERIM stable public
  # origin WITHOUT a domain, until the named Cloudflare tunnel + domain lands. The VPS host's
  # OWN tailscale node has all three Funnel ports (443/8443/10000) used by the co-located
  # blackheart workload ("Funnel exhausted on this box"), so Native cannot funnel there. This
  # is a SEPARATE tailscale node (its own container = its own tailnet identity), so it gets its
  # own hostname `native-prod.<tailnet>.ts.net` and its own three Funnel ports — blackheart is
  # untouched. Funnel maps :8443 -> edge:8080 (business) and :10000 -> edge:8081 (employee),
  # mirroring the two cloudflared quick tunnels. Stable across restarts (persisted node state),
  # so the APK origin baked against it never breaks like a quick tunnel does.
  #
  # Requires in prod.env: TS_AUTHKEY (a REUSABLE, non-ephemeral Tailscale auth key) and
  # COMPOSE_PROFILES=tsfunnel. The tailnet ACL must allow Funnel for this node (nodeAttrs
  # attr "funnel"); HTTPS/Funnel must be enabled for the tailnet (it already is — a8 UAT +
  # blackheart both funnel). Serve+funnel is declared in ./prod/tailscale/serve.json;
  # ${TS_CERT_DOMAIN} in that file is substituted with this node's FQDN at boot.
  tailscale-native:
    image: tailscale/tailscale:latest
    container_name: native-prod-tailscale
    profiles: ["tsfunnel"]
    restart: unless-stopped
    hostname: native-prod
    mem_limit: 128m
    cpus: 0.5
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: native-prod
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - native-prod-tailscale-state:/var/lib/tailscale
      - ./prod/tailscale/serve.json:/config/serve.json:ro

volumes:
  native-prod-pgdata:
  native-prod-kafka-data:
  native-prod-minio-data:
  native-prod-tailscale-state:
