spring:
  application:
    name: service-template

  datasource:
    # Connect as the service's own NON-superuser role (no BYPASSRLS) so RLS is
    # genuinely enforced. Overridden per environment; in real deploys the creds
    # come from Vault (short-TTL dynamic credentials).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/service_template}
    username: ${DB_USERNAME:service_template}
    password: ${DB_PASSWORD:service_template}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # The schema is owned by Flyway; the app only validates that the mapping
      # matches the migrated schema and never mutates DDL.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        # Lean observability: liveness/readiness + Prometheus metrics. /healthz is
        # the simple LB probe (see HealthController); richer probes under /actuator.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Pinned explicitly (never rely on Spring's implicit default): the unauthenticated
      # /actuator/health/** the gateway permits must NEVER leak DB/broker internals (version,
      # cluster-id, node-count, connection details). `never` keeps the body a bare {"status":...}.
      show-details: never
      # Readiness aggregates the DB indicator (ENGINEERING-STANDARDS §7): a pod reports
      # NOT_READY (and is pulled from rotation) while its schema/read model is still
      # hydrating or the DB is unreachable. Liveness stays the cheap /healthz probe (no
      # DB hit) so a transient DB blip never gets the pod killed. No Kafka here (this
      # template has no consumer); Kafka services add `kafka` to this list.
      group:
        readiness:
          include: readinessState, db
  metrics:
    tags:
      service: service-template

# Structured JSON logs are defined ONCE in libs/observability's shared logback-native-json.xml
# (ENGINEERING-STANDARDS §5), included via this service's logback-spring.xml. The old
# logging.pattern.console is intentionally gone: the dev console pattern now lives in that shared
# logback config (dev profile), and every non-dev profile emits one JSON object per line.
