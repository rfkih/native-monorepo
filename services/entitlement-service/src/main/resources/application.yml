spring:
  application:
    name: entitlement-service

  datasource:
    # Connect as the service's own NON-superuser role (no BYPASSRLS) so RLS is genuinely enforced.
    # Overridden per environment; in real deploys the creds come from Vault (short-TTL dynamic creds).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/entitlement_service}
    username: ${DB_USERNAME:entitlement_service}
    password: ${DB_PASSWORD:entitlement_service}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # The schema is owned by Flyway; the app only validates that the mapping matches the migrated
      # schema and never mutates DDL.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      # The libs/entitlement-check cache (per-company entitlement hash, invalidated by the
      # EntitlementGranted/Revoked events). Overridden per environment.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    # The CompanyCreated topic carries RAW Avro bytes (the producer outbox payload, shipped by
    # Debezium). We deserialize with libs/events AvroSerde against this service's OWN consumer copy
    # of the schema — NOT a Confluent kafka-avro-serializer / Schema Registry serde. So both key and
    # value come off the wire as String/byte[] and the listener does the Avro decode itself.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:entitlement-service}
      # Start at the earliest offset for a new group so a freshly-deployed consumer does not miss
      # already-published companies.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      # Manual-immediate ack: the container commits the offset only after the handler returns, so a
      # crash mid-handle redelivers (at-least-once); the idempotent consumer makes redelivery safe.
      ack-mode: record

# The entitlement-check cache TTL safety net (invalidation by event is the primary mechanism; this
# is only the backstop). A data/config value, externalized (ENGINEERING-STANDARDS §7).
native:
  entitlement:
    cache-ttl: ${ENTITLEMENT_CACHE_TTL:PT30M}
    # The DEFAULT modules a new company is granted when its CompanyCreated arrives. Data, not code
    # (ENGINEERING-STANDARDS §7) — the base verticals + the platform finance/hr modules.
    default-modules: ${ENTITLEMENT_DEFAULT_MODULES:restaurant,carwash,laundromat,hr,finance}

management:
  endpoints:
    web:
      exposure:
        # Lean observability: liveness/readiness + Prometheus metrics. /healthz is the simple LB
        # probe (see HealthController); richer probes under /actuator.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: entitlement-service

logging:
  pattern:
    # Structured-ish console pattern including the trace/span ids OpenTelemetry injects into MDC, so
    # logs correlate with traces once OTel is on the agent.
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{trace_id:-},%X{span_id:-}] %logger{36} - %msg%n"

---
# Defense-in-depth local JWT validation (#16, libs/security) — NON-DEV ONLY.
#
# This document activates on every profile EXCEPT `dev`. In a non-dev (production) profile the
# service validates the inbound RS256 token against Keycloak's JWKS locally (never trusting the
# gateway/header alone) and binds the tenant from the verified company_id claim; issuer-uri makes
# Spring validate the iss claim and discover the JWKS. Both default to the docker dev-stack Keycloak
# `native` realm and are overridden per environment via env/Vault.
#
# It is scoped to !dev on purpose: in the `dev` profile there is NO resource-server config, so Spring
# Boot's OAuth2 resource-server auto-configuration stays off and libs/security's permissive
# DevSecurityConfig governs while the header-trust DevTenantFilter binds the tenant (no Keycloak).
spring:
  config:
    activate:
      on-profile: "!dev"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/native}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/native/protocol/openid-connect/certs}
