spring:
  application:
    name: employee-service

  datasource:
    # Connect as the service's own NON-superuser role (no BYPASSRLS) so RLS is
    # genuinely enforced. Overridden per environment; in real deploys the creds
    # come from Vault (short-TTL dynamic credentials).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employee_service}
    username: ${DB_USERNAME:employee_service}
    password: ${DB_PASSWORD:employee_service}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # The schema is owned by Flyway; the app only validates that the mapping
      # matches the migrated schema and never mutates DDL.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Receipt photo upload (ADR 0030 §8, Phase E3) — the first multipart endpoint in the repo.
  # max-file-size bounds the single receipt part (mirrors ExpenseReceipt.MAX_BYTES / the DB CHECK
  # constraint); max-request-size adds headroom for the rest of the multipart envelope (boundary +
  # other form fields) without effectively doubling the allowance. A real Tomcat servlet container
  # enforces these via the standard StandardServletMultipartResolver here (unlike the gateway,
  # which proxies multipart WITHOUT ever resolving it — see the gateway's
  # MultipartUploadStreamingSpikeTest for why these two properties have no effect there).
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  kafka:
    # The OrgUnitCreated / OrgUnitChanged topic values are the org-service outbox Avro payload
    # (shipped by Debezium), base64-encoded on the wire: Debezium decodes the bytea payload as a
    # ByteBuffer that ByteArrayConverter cannot ship, so it emits base64 text
    # (binary.handling.mode=base64) via a StringConverter. libs/events Base64ByteArrayDeserializer
    # base64-decodes that back to the RAW Avro bytes, which we then decode with libs/events AvroSerde
    # against employee's OWN consumer copies of the schemas — NOT a Confluent kafka-avro-serializer /
    # Schema Registry serde. The base64 is a pure transport layer; the listener still receives raw
    # Avro byte[].
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:employee-service}
      # Start at the earliest offset for a new group so a freshly-deployed employee
      # consumer hydrates its org read model from already-published org units.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: id.co.nativeapp.events.Base64ByteArrayDeserializer
    listener:
      # Manual-immediate ack: the container commits the offset only after the handler
      # returns, so a crash mid-handle redelivers (at-least-once); the idempotent
      # consumer (ProcessedEventStore) makes redelivery safe.
      ack-mode: record
      # ADR 0010 #13 — outbox→Kafka trace continuity: propagate the W3C traceparent
      # Kafka header into a Micrometer child span on the listener. Applies to the
      # auto-configured factory; the custom kafkaListenerContainerFactory also sets
      # observationEnabled(true) in code so both paths are covered.
      observation-enabled: true

# PII column-level encryption key (rule 6). A base64-encoded 32-byte AES-256 key, sourced from the
# NATIVE_PII_KEY environment variable. IN PRODUCTION this env value is injected from VAULT (a
# short-TTL secret reference) — NEVER a literal secret committed here. The committed default below is
# a dev-only fallback (a placeholder, not a real secret) so the local stack has a deterministic key;
# the test suite overrides it via the NATIVE_PII_KEY system property in build.gradle.kts. The app
# fails fast at startup if the key is missing or not a valid 32-byte base64 value.
native:
  # Object storage (ADR 0048): expense-receipt payloads are content-addressed objects under the
  # employee/ prefix (PRIVATE — served only through the authenticated receipt endpoints, never the
  # public media proxy). Dev defaults target the host-published MinIO container with the fixed dev
  # credentials docker/minio/init.sh provisions; UAT/prod override via env. No public-base-url:
  # this service never embeds public media URLs. read-through-migrate flips legacy bytea rows to
  # object-backed as they are served (off = legacy rows keep serving from bytea, still correct).
  media:
    endpoint: ${MEDIA_ENDPOINT:http://localhost:9000}
    access-key: ${MEDIA_ACCESS_KEY:employee-media}
    secret-key: ${MEDIA_SECRET_KEY:employee-media-secret}
    bucket: ${MEDIA_BUCKET:native-media}
    service-prefix: employee
    read-through-migrate: ${MEDIA_READ_THROUGH_MIGRATE:true}

  # Error inbox + webhook alerting (ADR 0005/0009). A blank webhook-url (the default) disables all
  # outbound HTTP — safe for dev/CI. Set NATIVE_ALERT_WEBHOOK_URL in prod for DLT-milestone alerts.
  alert:
    webhook-url: ${NATIVE_ALERT_WEBHOOK_URL:}
    connect-timeout-ms: ${NATIVE_ALERT_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${NATIVE_ALERT_READ_TIMEOUT_MS:3000}
  pii:
    # base64 of the 32 ASCII bytes "native-dev-placeholder-pii-key32" — a dev-only placeholder, not a
    # real secret (the AES-256 key must decode to exactly 32 bytes).
    key: ${NATIVE_PII_KEY:bmF0aXZlLWRldi1wbGFjZWhvbGRlci1waWkta2V5MzI=}

management:
  endpoints:
    web:
      exposure:
        # Lean observability: liveness/readiness + Prometheus metrics. /healthz is
        # the simple LB probe (see HealthController); richer probes under /actuator.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Pinned explicitly (never rely on Spring's implicit default): the unauthenticated
      # /actuator/health/** the gateway permits must NEVER leak DB/broker internals (version,
      # cluster-id, node-count, connection details). `never` keeps the body a bare {"status":...}.
      show-details: never
      # Readiness aggregates the DB AND Kafka indicators (ENGINEERING-STANDARDS §7):
      # employee-service consumes OrgUnitCreated/Changed to hydrate its org read model, so
      # it must report NOT_READY (and be pulled from rotation) while that read model is
      # hydrating or the broker is down. Liveness stays the cheap /healthz probe.
      group:
        readiness:
          include: readinessState, db, kafka
  metrics:
    tags:
      service: employee-service

# Structured JSON logs are defined ONCE in libs/observability's shared logback-native-json.xml
# (ENGINEERING-STANDARDS §5), included via this service's logback-spring.xml — dev keeps a console
# pattern, every non-dev profile emits one JSON object per line.

---
# Defense-in-depth local JWT validation (#16, libs/security) — NON-DEV ONLY.
#
# This document activates on every profile EXCEPT `dev`. In a non-dev (production) profile the
# service validates the inbound RS256 token against Keycloak's JWKS locally (never trusting the
# gateway/header alone) and binds the tenant from the verified company_id claim; issuer-uri makes
# Spring validate the iss claim and discover the JWKS. Both default to the docker dev-stack Keycloak
# `native` realm and are overridden per environment via env/Vault.
#
# It is scoped to !dev on purpose: in the `dev` profile there is NO resource-server config, so Spring
# Boot's OAuth2 resource-server auto-configuration stays off and libs/security's permissive
# DevSecurityConfig governs while the header-trust DevTenantFilter binds the tenant (no Keycloak).
spring:
  config:
    activate:
      on-profile: "!dev"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/native}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/native/protocol/openid-connect/certs}
