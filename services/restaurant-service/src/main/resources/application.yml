spring:
  application:
    name: restaurant-service

  datasource:
    # Connect as the service's own NON-superuser role (no BYPASSRLS) so RLS is
    # genuinely enforced. Overridden per environment; in real deploys the creds
    # come from Vault (short-TTL dynamic credentials).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/restaurant_service}
    username: ${DB_USERNAME:restaurant_service}
    password: ${DB_PASSWORD:restaurant_service}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # The schema is owned by Flyway; the app only validates that the mapping
      # matches the migrated schema and never mutates DDL.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      # The libs/entitlement-check cache (per-company entitlement hash, invalidated by the
      # EntitlementGranted/Revoked events — Phase 6, ADR 0029). Overridden per environment.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    # UserOutletAssignmentChanged topic value is the org-service outbox Avro payload shipped by
    # Debezium: binary.handling.mode=base64 means the wire value is base64-encoded text arriving
    # via a StringConverter. libs/events Base64ByteArrayDeserializer decodes it back to raw Avro
    # bytes which the listener hands to AvroSerde against the shared libs/contracts schema.
    # No Confluent kafka-avro-serializer / Schema Registry serde used.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:restaurant-service}
      # Earliest offset: a freshly-deployed consumer must replay all assignment events so the
      # user_outlet_assignment_ref read model is fully hydrated before enforcement begins.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: id.co.nativeapp.events.Base64ByteArrayDeserializer
    listener:
      # Record-level ack: offset committed only after the handler returns — at-least-once
      # delivery. ProcessedEventStore (idempotent on event UUID) makes redelivery safe.
      ack-mode: record
      # ADR 0010 #13 — outbox→Kafka trace continuity.
      observation-enabled: true

# restaurant-service config — externalized, validated at startup (fail fast — ENGINEERING-STANDARDS
# §7). No business config is hardcoded in Java.
native:
  giftcard:
    # Security review W-4: the HMAC-SHA256 key GiftCardCodeGenerator keys the card-code derivation
    # with, base64-encoded 32-byte value, NATIVE_GIFTCARD_CODE_KEY env var, Vault-injected in prod.
    # MUST be the IDENTICAL value in loyalty-service/carwash-service/barbershop-service (their own
    # native.giftcard.code-key) — a mismatch would make the same card resolve to a different code
    # depending on which service derives it. The committed default below is a DEV/TEST-ONLY
    # placeholder shared verbatim across all four services' application.yml, never a real secret.
    code-key: ${NATIVE_GIFTCARD_CODE_KEY:Z2lmdC1jYXJkLWNvZGUtaG1hYy1rZXktMDEyMzQ1Njc=}
    # Security review W-3: the ceiling on a single gift-card SELL's amountMinor. IDR's minor unit is
    # one whole rupiah, so 5,000,000 = Rp5,000,000. A request above this is rejected 422
    # (gift-card-mint-limit). NATIVE_GIFTCARD_MAX_MINT_MINOR env var.
    max-mint-minor: ${NATIVE_GIFTCARD_MAX_MINT_MINOR:5000000}
  self-order:
    # Phase 6 (ADR 0029): the AES-256-GCM key SelfOrderSecretCipher encrypts each outlet's per-QR
    # HMAC secret with at rest (self_order_access.secret_encrypted), base64-encoded 32-byte value,
    # NATIVE_SELFORDER_KEY env var, Vault-injected in prod. A DEDICATED key — unlike
    # native.giftcard.code-key, this one is NOT fleet-shared (no other service ever needs to derive
    # the same self-order secret), so there is no cross-service-match requirement. The committed
    # default below is a DEV/TEST-ONLY placeholder, never a real secret.
    secret-key: ${NATIVE_SELFORDER_KEY:Ghb7IF81XLo6yUS6NZQZBNveUV/utZeOm2zfd+RXXlg=}
    # The ceiling on one outlet's UNCONFIRMED (PARKED, source=SELF_ORDER) order count. A create
    # request once at/over this ceiling is rejected 429 (self-order-cap-exceeded).
    # NATIVE_SELFORDER_PARK_CAP env var.
    park-cap: ${NATIVE_SELFORDER_PARK_CAP:50}
    # How long a PARKED SELF_ORDER row may sit unconfirmed before the lazy sweep (run on the next
    # create for that outlet — no @Scheduled job in this fleet) moves it to the terminal EXPIRED
    # status. NATIVE_SELFORDER_EXPIRY env var (ISO-8601 duration).
    expiry: ${NATIVE_SELFORDER_EXPIRY:PT30M}
    # The entitlement module the self-order-create path is gated on.
    module-key: ${NATIVE_SELFORDER_MODULE_KEY:self_order}
    # The entitlement-check Redis cache TTL safety net; invalidation by the
    # EntitlementGranted/Revoked events is the primary consistency mechanism, this is only the
    # backstop. NATIVE_SELFORDER_CACHE_TTL env var.
    cache-ttl: ${NATIVE_SELFORDER_CACHE_TTL:PT30M}

management:
  endpoints:
    web:
      exposure:
        # Lean observability: liveness/readiness + Prometheus metrics. /healthz is
        # the simple LB probe (see HealthController); richer probes under /actuator.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Pinned explicitly (never rely on Spring's implicit default): the unauthenticated
      # /actuator/health/** the gateway permits must NEVER leak DB/broker internals (version,
      # cluster-id, node-count, connection details). `never` keeps the body a bare {"status":...}.
      show-details: never
      # Readiness aggregates the DB AND Kafka indicators (ENGINEERING-STANDARDS §7): NOT_READY
      # while the DB or the Kafka broker is unreachable. Phase 5 adds restaurant as a Kafka
      # consumer (UserOutletAssignmentChanged), so broker reachability now affects the
      # outlet-enforcement read model. NOTE the kafka indicator checks BROKER REACHABILITY only —
      # it does NOT gate on the consumer being caught up, so on a first deploy (earliest-offset
      # replay) enforcement may briefly run against a partially-hydrated
      # user_outlet_assignment_ref (known limitation, tracked in DEVLOG; the zero-rows grandfather
      # keeps never-adopted tenants unaffected). Liveness stays the cheap /healthz probe
      # (no DB/broker hit).
      group:
        readiness:
          include: readinessState, db, kafka
  metrics:
    tags:
      service: restaurant-service

# Structured JSON logs are defined ONCE in libs/observability's shared logback-native-json.xml
# (ENGINEERING-STANDARDS §5), included via this service's logback-spring.xml — dev keeps a console
# pattern, every non-dev profile emits one JSON object per line.

---
# Defense-in-depth local JWT validation (#16, libs/security) — NON-DEV ONLY.
#
# This document activates on every profile EXCEPT `dev`. In a non-dev (production) profile the
# service validates the inbound RS256 token against Keycloak's JWKS locally (never trusting the
# gateway/header alone) and binds the tenant from the verified company_id claim; issuer-uri makes
# Spring validate the iss claim and discover the JWKS. Both default to the docker dev-stack
# Keycloak `native` realm and are overridden per environment via env/Vault.
#
# It is scoped to !dev on purpose: in the `dev` profile there is NO resource-server config, so
# Spring Boot's OAuth2 resource-server auto-configuration stays off and libs/security's permissive
# DevSecurityConfig governs while the header-trust DevTenantFilter binds the tenant (no Keycloak).
#
# NOTE Phase 6 (ADR 0029): /api/v1/self-order/** is the fleet's second fully-anonymous route (after
# org-service's POST /api/v1/signup) — a diner's phone carries no Keycloak token at all, only the
# X-Self-Order-Token header id.co.nativeapp.restaurant.config.SelfOrderTokenFilter verifies. Without
# this declaration the shared libs/security JwtSecurityConfig would 401 every self-order request
# before the filter ever ran (every service independently validates JWTs — restaurant-service's own
# chain, not just the gateway's). native.security.public-paths permitAlls these two paths AND makes
# libs.security.TenantBindingFilter skip them entirely (see its shouldNotFilter), so
# SelfOrderTokenFilter is the ONLY authentication step this surface sees — mirrors org-service's
# POST /api/v1/signup exemption exactly (same mechanism, proven end-to-end there against a real
# Keycloak by SignupAcceptanceTest/SecuredCompanyBootstrapTest).
spring:
  config:
    activate:
      on-profile: "!dev"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/native}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/native/protocol/openid-connect/certs}

native:
  security:
    public-paths:
      - "GET /api/v1/self-order/menu"
      - "POST /api/v1/self-order/orders"
