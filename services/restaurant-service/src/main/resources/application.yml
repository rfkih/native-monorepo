spring:
  application:
    name: restaurant-service

  datasource:
    # Connect as the service's own NON-superuser role (no BYPASSRLS) so RLS is
    # genuinely enforced. Overridden per environment; in real deploys the creds
    # come from Vault (short-TTL dynamic credentials).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/restaurant_service}
    username: ${DB_USERNAME:restaurant_service}
    password: ${DB_PASSWORD:restaurant_service}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # The schema is owned by Flyway; the app only validates that the mapping
      # matches the migrated schema and never mutates DDL.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        # Lean observability: liveness/readiness + Prometheus metrics. /healthz is
        # the simple LB probe (see HealthController); richer probes under /actuator.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: restaurant-service

logging:
  pattern:
    # Structured-ish console pattern including the trace/span ids OpenTelemetry
    # injects into MDC, so logs correlate with traces once OTel is on the agent.
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{trace_id:-},%X{span_id:-}] %logger{36} - %msg%n"

---
# Defense-in-depth local JWT validation (#16, libs/security) — NON-DEV ONLY.
#
# This document activates on every profile EXCEPT `dev`. In a non-dev (production) profile the
# service validates the inbound RS256 token against Keycloak's JWKS locally (never trusting the
# gateway/header alone) and binds the tenant from the verified company_id claim; issuer-uri makes
# Spring validate the iss claim and discover the JWKS. Both default to the docker dev-stack
# Keycloak `native` realm and are overridden per environment via env/Vault.
#
# It is scoped to !dev on purpose: in the `dev` profile there is NO resource-server config, so
# Spring Boot's OAuth2 resource-server auto-configuration stays off and libs/security's permissive
# DevSecurityConfig governs while the header-trust DevTenantFilter binds the tenant (no Keycloak).
spring:
  config:
    activate:
      on-profile: "!dev"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/native}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/native/protocol/openid-connect/certs}
