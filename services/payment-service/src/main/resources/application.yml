spring:
  application:
    name: payment-service

  datasource:
    # Connect as the service's own NON-superuser role (no BYPASSRLS) so RLS is
    # genuinely enforced. Overridden per environment; in real deploys the creds
    # come from Vault (short-TTL dynamic credentials).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_service}
    username: ${DB_USERNAME:payment_service}
    password: ${DB_PASSWORD:payment_service}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # The schema is owned by Flyway; the app only validates that the mapping
      # matches the migrated schema and never mutates DDL.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Static QRIS image upload (ADR 0045) — the merchant's own QR, served back to the till verbatim.
  # max-file-size bounds the single image part (mirrors PaymentSettings.MAX_QR_IMAGE_BYTES / the DB
  # CHECK constraint); max-request-size adds headroom for the multipart envelope (boundary + other
  # form fields) without effectively doubling the allowance. The employee-service receipt idiom.
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

# payment-service config — externalized, validated at startup (fail fast — ENGINEERING-STANDARDS
# §7). No business config is hardcoded in Java.
native:
  # Object storage (ADR 0048): the static QRIS image is a content-addressed object under the
  # payment/ prefix (PRIVATE — served only through the authenticated /static-qr/image endpoint,
  # never the public media proxy). Dev defaults target the host-published MinIO container with the
  # fixed dev credentials docker/minio/init.sh provisions; UAT/prod override via env. No
  # public-base-url: this service never embeds public media URLs. read-through-migrate flips
  # legacy bytea rows to object-backed as they are served.
  media:
    endpoint: ${MEDIA_ENDPOINT:http://localhost:9000}
    access-key: ${MEDIA_ACCESS_KEY:payment-media}
    secret-key: ${MEDIA_SECRET_KEY:payment-media-secret}
    bucket: ${MEDIA_BUCKET:native-media}
    service-prefix: payment
    read-through-migrate: ${MEDIA_READ_THROUGH_MIGRATE:true}

  # ADR 0045: the Midtrans settlement webhook is the fleet's second fully-anonymous surface (after
  # self-order, ADR 0029) — Midtrans carries no Keycloak token; WebhookService is the ONLY
  # authentication step (provisional tenant bind from the callback URL -> RLS-scoped loads ->
  # constant-time signature verify). Without this declaration the shared libs/security chain would
  # 401 every notification before the service logic ever ran.
  security:
    public-paths:
      - "POST /api/v1/psp-webhooks/midtrans/*"
  # Error inbox + webhook alerting (ADR 0005/0009). A blank webhook-url (the default) disables all
  # outbound HTTP — safe for dev/CI. Set NATIVE_ALERT_WEBHOOK_URL in prod for parked-anomaly alerts.
  alert:
    webhook-url: ${NATIVE_ALERT_WEBHOOK_URL:}
    connect-timeout-ms: ${NATIVE_ALERT_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${NATIVE_ALERT_READ_TIMEOUT_MS:3000}
  pii:
    # Credential column-level encryption (rule 6 — the merchant's own Midtrans server/client key
    # are secret-grade tenant data). AES-256-GCM key, a base64-encoded 32-byte value, supplied as
    # the NATIVE_PII_KEY env var in every real environment (Vault-injected in prod — see
    # PiiEncryptionProperties javadoc). The committed default below is a DEV/TEST-ONLY placeholder,
    # never a real secret.
    key: ${NATIVE_PII_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  payment:
    # The PUBLIC gateway origin Midtrans must reach for the per-charge webhook callback
    # (X-Override-Notification). Blank (the default) omits the header — settlement then arrives
    # via POST /payment-charges/{id}/sync. Set to the UAT Funnel / prod origin in real deploys.
    webhook-base-url: ${NATIVE_PAYMENT_WEBHOOK_BASE_URL:}
    midtrans:
      # Base URLs are constants of the Midtrans platform; overridable ONLY so tests can point at
      # a local stub server. The merchant's environment (SANDBOX vs PRODUCTION) selects which one.
      sandbox-base-url: ${NATIVE_MIDTRANS_SANDBOX_BASE_URL:https://api.sandbox.midtrans.com}
      production-base-url: ${NATIVE_MIDTRANS_PRODUCTION_BASE_URL:https://api.midtrans.com}
      connect-timeout-ms: ${NATIVE_MIDTRANS_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${NATIVE_MIDTRANS_READ_TIMEOUT_MS:10000}
      # Midtrans custom_expiry for the dynamic QR — how long the customer has to scan and pay.
      expiry-minutes: ${NATIVE_MIDTRANS_EXPIRY_MINUTES:15}

management:
  endpoints:
    web:
      exposure:
        # Lean observability: liveness/readiness + Prometheus metrics. /healthz is
        # the simple LB probe (see HealthController); richer probes under /actuator.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Pinned explicitly (never rely on Spring's implicit default): the unauthenticated
      # /actuator/health/** the gateway permits must NEVER leak DB internals (version,
      # connection details). `never` keeps the body a bare {"status":...}.
      show-details: never
      # Readiness aggregates the DB indicator (ENGINEERING-STANDARDS §7): a pod reports
      # NOT_READY (and is pulled from rotation) while its schema is still hydrating or
      # the DB is unreachable. Liveness stays the cheap /healthz probe (no DB hit) so a
      # transient DB blip never gets the pod killed. No Kafka here (producer-only via
      # the outbox; Debezium does the transport).
      group:
        readiness:
          include: readinessState, db
  metrics:
    tags:
      service: payment-service

# Structured JSON logs are defined ONCE in libs/observability's shared logback-native-json.xml
# (ENGINEERING-STANDARDS §5), included via this service's logback-spring.xml.

---
# Defense-in-depth local JWT validation (#16, libs/security) — NON-DEV ONLY (the fleet-standard
# !dev document every service carries; the template omits it because it never ran non-dev, which
# made the first UAT boot fail with "jwkSetUri cannot be empty"). In a non-dev profile the service
# validates the inbound RS256 token against Keycloak's JWKS locally and binds the tenant from the
# verified company_id claim. Scoped to !dev on purpose: in `dev` there is NO resource-server
# config, so libs/security's permissive DevSecurityConfig governs and the header-trust
# DevTenantFilter binds the tenant. The anonymous PSP webhook stays open in BOTH profiles via the
# top-level native.security.public-paths declaration above.
spring:
  config:
    activate:
      on-profile: "!dev"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/native}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/native/protocol/openid-connect/certs}
