spring:
  application:
    name: notification-service

  datasource:
    # Connect as the service's own NON-superuser role (no BYPASSRLS) so RLS is genuinely enforced.
    # Overridden per environment; in real deploys the creds come from Vault (short-TTL dynamic creds).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification_service}
    username: ${DB_USERNAME:notification_service}
    password: ${DB_PASSWORD:notification_service}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # The schema is owned by Flyway; the app only validates that the mapping matches the migrated
      # schema and never mutates DDL.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  kafka:
    # The ConsolidationClosed topic value is the finance outbox Avro payload (shipped by Debezium),
    # base64-encoded on the wire: Debezium decodes the bytea payload as a ByteBuffer that
    # ByteArrayConverter cannot ship, so it emits base64 text (binary.handling.mode=base64) via a
    # StringConverter. libs/events Base64ByteArrayDeserializer base64-decodes that back to the RAW
    # Avro bytes, which we then decode with libs/events AvroSerde against this service's OWN consumer
    # copy of the schema — NOT a Confluent kafka-avro-serializer / Schema Registry serde. The base64
    # is a pure transport layer; the listener still receives raw Avro byte[].
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:notification-service}
      # Start at the earliest offset for a new group so a freshly-deployed notification consumer does
      # not miss already-published consolidation closes.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: id.co.nativeapp.events.Base64ByteArrayDeserializer
    listener:
      # Manual-immediate ack: the container commits the offset only after the handler returns, so a
      # crash mid-handle redelivers (at-least-once); the idempotent consumer (ProcessedEventStore)
      # makes redelivery safe.
      ack-mode: record

# notification-service config — externalized, validated at startup (fail fast — ENGINEERING-STANDARDS
# §7). No business config is hardcoded in Java.
native:
  notification:
    # The placeholder recipient a consolidation-closed notification is addressed to in this slice
    # (the per-company recipient directory is a future integration). Data, not code.
    default-recipient: ${NOTIFICATION_DEFAULT_RECIPIENT:owner@example.co.id}
    sender:
      # Which transport the stubbed NotificationSender simulates. STUB always records a successful
      # delivery with a synthetic provider_ref (the only mode wired in this slice). The real
      # SMTP/push provider is a future integration selected here (e.g. SMTP / FCM) — see
      # NotificationSenderConfig. Data, not code.
      mode: ${NOTIFICATION_SENDER_MODE:STUB}
      # When true, the STUB transport simulates a delivery FAILURE instead of a success — used to
      # exercise the FAILED path (the failure is recorded, never swallowed). Default false.
      simulate-failure: ${NOTIFICATION_SENDER_SIMULATE_FAILURE:false}

management:
  endpoints:
    web:
      exposure:
        # Lean observability: liveness/readiness + Prometheus metrics. /healthz is the simple LB
        # probe (see HealthController); richer probes under /actuator.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Pinned explicitly (never rely on Spring's implicit default): the unauthenticated
      # /actuator/health/** the gateway permits must NEVER leak DB/broker internals (version,
      # cluster-id, node-count, connection details). `never` keeps the body a bare {"status":...}.
      show-details: never
      # Readiness aggregates the DB AND Kafka indicators (ENGINEERING-STANDARDS §7):
      # notification-service consumes ConsolidationClosed, so it must report NOT_READY (and
      # be pulled from rotation) while its read model is hydrating or the broker is down.
      # Liveness stays the cheap /healthz probe.
      group:
        readiness:
          include: readinessState, db, kafka
  metrics:
    tags:
      service: notification-service

# Structured JSON logs are defined ONCE in libs/observability's shared logback-native-json.xml
# (ENGINEERING-STANDARDS §5), included via this service's logback-spring.xml — dev keeps a console
# pattern, every non-dev profile emits one JSON object per line.

---
# Defense-in-depth local JWT validation (#16, libs/security) — NON-DEV ONLY.
#
# This document activates on every profile EXCEPT `dev`. In a non-dev (production) profile the
# service validates the inbound RS256 token against Keycloak's JWKS locally (never trusting the
# gateway/header alone) and binds the tenant from the verified company_id claim; issuer-uri makes
# Spring validate the iss claim and discover the JWKS. Both default to the docker dev-stack Keycloak
# `native` realm and are overridden per environment via env/Vault.
#
# It is scoped to !dev on purpose: in the `dev` profile there is NO resource-server config, so Spring
# Boot's OAuth2 resource-server auto-configuration stays off and libs/security's permissive
# DevSecurityConfig governs while the header-trust DevTenantFilter binds the tenant (no Keycloak).
spring:
  config:
    activate:
      on-profile: "!dev"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/native}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/native/protocol/openid-connect/certs}
