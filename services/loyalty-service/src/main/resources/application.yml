spring:
  application:
    name: loyalty-service

  datasource:
    # Connect as the service's own NON-superuser role (no BYPASSRLS) so RLS is genuinely enforced.
    # Overridden per environment; in real deploys the creds come from Vault (short-TTL dynamic creds).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loyalty_service}
    username: ${DB_USERNAME:loyalty_service}
    password: ${DB_PASSWORD:loyalty_service}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # The schema is owned by Flyway; the app only validates that the mapping matches the migrated
      # schema and never mutates DDL.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  kafka:
    # The SaleRecorded/GiftCardSold/SaleVoided/SaleRefunded topic values are the producer outbox
    # Avro payload (shipped by Debezium), base64-encoded on the wire: Debezium decodes the bytea
    # payload as a ByteBuffer that ByteArrayConverter cannot ship, so it emits base64 text
    # (binary.handling.mode=base64) via a StringConverter. libs/events Base64ByteArrayDeserializer
    # base64-decodes that back to the RAW Avro bytes, which we then decode with libs/events
    # AvroSerde against the SHARED libs/contracts schema (SaleRecorded/GiftCardSold — ADR 0003) —
    # NOT a Confluent kafka-avro-serializer / Schema Registry serde.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:loyalty-service}
      # Start at the earliest offset for a new group so a freshly-deployed loyalty consumer
      # hydrates from already-published sale/gift-card events.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: id.co.nativeapp.events.Base64ByteArrayDeserializer
    listener:
      # Manual-immediate ack: the container commits the offset only after the handler returns, so a
      # crash mid-handle redelivers (at-least-once); the idempotent consumer (ProcessedEventStore)
      # makes redelivery safe.
      ack-mode: record
      # ADR 0010 #13 — outbox→Kafka trace continuity: propagate the W3C traceparent
      # Kafka header into a Micrometer child span on the listener. Applies to the
      # auto-configured factory; the custom kafkaListenerContainerFactory also sets
      # observationEnabled(true) in code so both paths are covered.
      observation-enabled: true

# loyalty-service config — externalized, validated at startup (fail fast — ENGINEERING-STANDARDS
# §7). No business config is hardcoded in Java.
native:
  # Error inbox + webhook alerting (ADR 0005/0009). A blank webhook-url (the default) disables all
  # outbound HTTP — safe for dev/CI. Set NATIVE_ALERT_WEBHOOK_URL in prod for DLT-milestone alerts.
  alert:
    webhook-url: ${NATIVE_ALERT_WEBHOOK_URL:}
    connect-timeout-ms: ${NATIVE_ALERT_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${NATIVE_ALERT_READ_TIMEOUT_MS:3000}
  pii:
    # PII column-level encryption (rule 6 — member phone + display name). AES-256-GCM key, a
    # base64-encoded 32-byte value, supplied as the NATIVE_PII_KEY env var in every real
    # environment (Vault-injected in prod — see PiiEncryptionProperties javadoc). The committed
    # default below is a DEV/TEST-ONLY placeholder, never a real secret.
    key: ${NATIVE_PII_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    # The HMAC-SHA256 key used to derive phone_hash for exact-match member lookup (a SEPARATE key
    # from the AES encryption key above — the hash must stay stable/deterministic per phone, unlike
    # the randomized-IV encryption). base64-encoded 32-byte value, NATIVE_PII_HMAC_KEY env var,
    # Vault-injected in prod. See PhoneHasherProperties javadoc.
    hmac-key: ${NATIVE_PII_HMAC_KEY:ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=}
  giftcard:
    # Security review W-4: the HMAC-SHA256 key GiftCardCodeGenerator keys the card-code derivation
    # with, base64-encoded 32-byte value, NATIVE_GIFTCARD_CODE_KEY env var, Vault-injected in prod.
    # MUST be the IDENTICAL value in restaurant-service/carwash-service/barbershop-service (their
    # own native.giftcard.code-key) — a mismatch would make the same card resolve to a different
    # code depending on which service derives it. The committed default below is a DEV/TEST-ONLY
    # placeholder shared verbatim across all four services' application.yml, never a real secret.
    code-key: ${NATIVE_GIFTCARD_CODE_KEY:Z2lmdC1jYXJkLWNvZGUtaG1hYy1rZXktMDEyMzQ1Njc=}

management:
  endpoints:
    web:
      exposure:
        # Lean observability: liveness/readiness + Prometheus metrics. /healthz is the simple LB
        # probe (see HealthController); richer probes under /actuator.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Pinned explicitly (never rely on Spring's implicit default): the unauthenticated
      # /actuator/health/** the gateway permits must NEVER leak DB/broker internals (version,
      # cluster-id, node-count, connection details). `never` keeps the body a bare {"status":...}.
      show-details: never
      # Readiness aggregates the DB AND Kafka indicators (ENGINEERING-STANDARDS §7): loyalty-service
      # consumes sale/gift-card events to build its ledger, so it must report NOT_READY (and be
      # pulled from rotation) while the broker is down. Liveness stays the cheap /healthz probe.
      group:
        readiness:
          include: readinessState, db, kafka
  metrics:
    tags:
      service: loyalty-service

# Structured JSON logs are defined ONCE in libs/observability's shared logback-native-json.xml
# (ENGINEERING-STANDARDS §5), included via this service's logback-spring.xml — dev keeps a console
# pattern, every non-dev profile emits one JSON object per line.

---
# Defense-in-depth local JWT validation (#16, libs/security) — NON-DEV ONLY.
#
# This document activates on every profile EXCEPT `dev`. In a non-dev (production) profile the
# service validates the inbound RS256 token against Keycloak's JWKS locally (never trusting the
# gateway/header alone) and binds the tenant from the verified company_id claim; issuer-uri makes
# Spring validate the iss claim and discover the JWKS. Both default to the docker dev-stack Keycloak
# `native` realm and are overridden per environment via env/Vault.
#
# It is scoped to !dev on purpose: in the `dev` profile there is NO resource-server config, so Spring
# Boot's OAuth2 resource-server auto-configuration stays off and libs/security's permissive
# DevSecurityConfig governs while the header-trust DevTenantFilter binds the tenant (no Keycloak).
spring:
  config:
    activate:
      on-profile: "!dev"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/native}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/native/protocol/openid-connect/certs}
