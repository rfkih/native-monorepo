apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Release signing (ADR 0043 D7): the keystore lives OUTSIDE the repo and is referenced by the
// gitignored android/keystore.properties (see README). Without that file, release builds are
// simply unsigned — debug builds are unaffected — so CI/fresh clones still compile.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace = "id.co.nativeapp.till"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "id.co.nativeapp.till"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Bumps ONLY on native changes (ADR 0043 D7) — web features ship without an app release.
        // 4 = release signing introduced; 5 = launcher rename "Native Till" → "Native";
        // 7 = @capacitor/splash-screen plugin (cold-start splash);
        // 8 = @capgo/capacitor-updater OTA plugin (ADR 0051 P3, dormant until NATIVE_TILL_UPDATE_URL);
        // 9 = allowNavigation auth-host whitelist (login must stay in the WebView — config is native);
        // 10 = NativeShell plugin v2 (minimize for the back-guard exit + saveFile Downloads + printPage).
        versionCode 10
        versionName "1.8"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Per-environment app identities (ADR 0058): UAT and prod are SEPARATE installable apps so a
    // tester can run both side-by-side and never confuse them. The WebView origin is still chosen at
    // `cap sync` time (NATIVE_TILL_URL in capacitor.config.ts); the flavor only sets the app's
    // Android identity + name + badged icon. Use `npm run build:uat` / `build:prod` (scripts/
    // build-app.mjs) so one flag pairs the right origin with the right flavor.
    flavorDimensions "env"
    productFlavors {
        // Prod = the canonical, permanent identity (also the future Play upload id). Built from
        // src/main: applicationId id.co.nativeapp.till, launcher name "Native", brand icon.
        prod {
            dimension "env"
        }
        // UAT = a distinct app: applicationId id.co.nativeapp.till.uat, name "Native UAT", badged
        // (amber) icon. Overrides live in src/uat/res (strings + adaptive icon). The .uat suffix
        // lets it install alongside prod and keeps its OTA channel separate.
        uat {
            dimension "env"
            applicationIdSuffix ".uat"
            versionNameSuffix "-uat"
        }
    }
    signingConfigs {
        release {
            if (keystoreProps.getProperty('storeFile')) {
                storeFile file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            // Deliberately NOT minified: the shell is ~4 MB of Capacitor + one plugin; R8's
            // saving isn't worth the reflection risk on the JS bridge without a device matrix.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystoreProps.getProperty('storeFile')) {
                signingConfig signingConfigs.release
            }
        }
    }
    buildFeatures {
        buildConfig true
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
