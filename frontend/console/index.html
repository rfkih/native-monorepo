<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Set the theme BEFORE first paint to avoid a flash of the wrong colours (FOUC). Reads the
         same storage key as src/lib/theme.ts; falls back to the OS preference. -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('native.console.theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = t
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Native — Console</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Runtime config (window.__NATIVE_CONFIG__). A stub in dev (public/env.js); the container
         regenerates it from env vars at start so ONE built image serves every environment. Loaded
         as a classic script so it runs BEFORE the deferred module bundle reads it. -->
    <script src="/env.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
