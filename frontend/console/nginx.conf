# Static serving for the console SPA (non-root nginx-unprivileged listens on 8080).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed build assets — safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the entry document or the runtime config (so a redeploy / env change is picked up).
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /env.js {
        add_header Cache-Control "no-store";
    }

    # SPA history fallback — client routes (/pos, /auth/callback, ...) resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
