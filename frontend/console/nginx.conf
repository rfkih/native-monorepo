# Static serving for the console SPA (non-root nginx-unprivileged listens on 8080).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression (startup-perf pass): the SPA is text — JS/CSS/JSON/SVG — which gzips ~3-4x. The
    # entry chunk alone is ~700 KB uncompressed; without this it ships raw on every cold start, and
    # the Android till shell has NO service worker to soften it (ADR 0043). `gzip_static on` serves a
    # precompressed .gz next to an asset if one exists (build-time brotli/gzip later), otherwise nginx
    # compresses on the fly at level 6. `gzip_proxied any` is required because this origin always sits
    # behind the edge proxy (docker/uat/edge.conf) — without it nginx skips compression for proxied
    # requests. woff2 is already compressed, so it is deliberately absent from the type list.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml;

    # Content-hashed build assets — safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the entry document or the runtime config (so a redeploy / env change is picked up).
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /env.js {
        add_header Cache-Control "no-store";
    }
    # The Native shell (ADR 0043) loads the ORIGIN ROOT `/`, not `/index.html`, and has NO service
    # worker — so without this the WebView's HTTP cache serves a stale app shell (and thus stale
    # hashed chunks) on relaunch, which is exactly how a fixed bug "doesn't show up" after a deploy.
    # Serving `/` no-store makes each launch revalidate the shell → it always references the latest
    # immutable /assets/ chunks. (SPA routes like /pos are client-routed, never server-fetched here.)
    location = / {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }
    # The deploy's build advertiser (ADR 0062) — must never be cached, or a stale client can't learn
    # it is behind. lib/appVersion also fetches it with `cache: no-store`; this is defence in depth.
    location = /version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # SPA history fallback — client routes (/pos, /auth/callback, ...) resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
