# Static serving for the Employee SPA (non-root nginx-unprivileged listens on 8080).
# Identical SPA-serving contract to the console (frontend/console/nginx.conf): content-hashed
# assets cache forever, the entry document + runtime env.js never cache, everything else falls
# back to index.html so client routes (/me, /me/expenses, /auth/callback, …) resolve.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed build assets — safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the entry document or the runtime config (so a redeploy / env change is picked up).
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /env.js {
        add_header Cache-Control "no-store";
    }

    # SPA history fallback — client routes (/me, /auth/callback, ...) resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
